# electron-builder configuration for Breakmine Desktop.
#
# Produces:
#   release/*.AppImage          Linux   (built on Linux)
#   release/Breakmine Setup.exe Windows  (built on Windows, or on Linux with wine)
#
# Picked up automatically by `npx electron-builder` and by the
# npm run dist:linux / dist:win scripts.

appId: com.breakmine.desktop
productName: Breakmine
copyright: Copyright © Breakmine

directories:
  output: release
  buildResources: src/resources

# Ship only what the packaged game actually reads at runtime.
#
# The repository root also carries worlds/, players/, objects/, data/, wiki/,
# a ~80 MB dist-single/ and a .git directory. None of that belongs in an
# installed game, so the list is explicit rather than "everything".
#
# dist/ and src/resources.js are both in .gitignore and are generated by
# `npm run build`, which is why they are listed here explicitly instead of
# being picked up by a default include.
files:
  - package.json
  - index.html
  - "src/**"
  - "libraries/**"
  - "dist/**"
  # The Electron main process only ever requires discord-rpc (main.js) and
  # jszip (deeplink.js). The remaining entries in package.json dependencies
  # - better-sqlite3, bcrypt, sharp, express, ws and friends - belong to the
  # separate multiplayer server in server.js, which the desktop game never
  # loads, so they are kept out of the bundle.
  #
  # Order matters: electron-builder applies patterns in sequence and the last
  # match wins, so the blanket exclusion has to come before the two keeps.
  - "!node_modules/**"
  - "node_modules/discord-rpc/**"
  - "node_modules/jszip/**"
  - "!src/**/*.map"
  - "!dist/**/*.map"

# The native modules that were just excluded are the only ones that would need
# rebuilding against Electron's ABI, and nothing in the packaged app loads
# them. Skipping the rebuild keeps `npm run dist:linux` from spending minutes
# compiling packages that are never required.
npmRebuild: false

# The renderer has no Node access (contextIsolation, nodeIntegration false),
# so there is no reason to unpack anything out of the archive.
asar: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Game
  icon: favicon.png
  synopsis: Minecraft in JavaScript
  description: >-
    Breakmine, a Minecraft-like voxel game written in JavaScript. Drop mods
    into the mods folder or install them straight from the mod wiki.
  # `desktop.entry` overwrites the keys electron-builder computes by default.
  # Name, Comment, StartupWMClass and Categories are all derived from
  # productName / description / desktopName / `category` above, so only the
  # custom scheme is worth setting here.
  desktop:
    entry:
      # Makes this the handler for breakmine-game:// so mod-wiki download links
      # can install straight into the game.
      MimeType: x-scheme-handler/breakmine-game;

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: favicon.png

nsis:
  # Registers breakmine-game:// in the registry. Windows has no MimeType
  # equivalent of the Linux desktop entry, so the scheme needs explicit keys.
  include: build/installer.nsh
  # Assisted rather than one-click, so a user installing by hand can pick a
  # directory. scripts/install.ps1 drives it silently with /S and /D=.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Breakmine
  artifactName: "${productName}-${version}-setup.${ext}"