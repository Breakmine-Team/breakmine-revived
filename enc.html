<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP4 Encryptor & Decryptor</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    .card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="file"], input[type="password"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 15px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background: #999;
    }
    video {
      width: 100%;
      border-radius: 8px;
      margin-top: 15px;
      background: #000;
    }
    .status {
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <h2>MP4 Encryptor / Decryptor</h2>

  <div class="card">
    <div class="field">
      <label for="videoInput">Select MP4 (or Encrypted File):</label>
      <input type="file" id="videoInput">
    </div>

    <div class="field">
      <label for="password">Password:</label>
      <input type="password" id="password" placeholder="Enter encryption/decryption key">
    </div>

    <button id="encryptBtn">Encrypt & Download</button>
    <button id="decryptBtn">Decrypt & Play</button>
  </div>

  <p class="status" id="status"></p>
  <video id="videoPlayer" controls style="display:none;"></video>

  <!-- Embed the Library directly or load via src="media-encryptor.js" -->
  <script src="media-encryptor.js"></script>

  <script>
    const fileInput = document.getElementById('videoInput');
    const passwordInput = document.getElementById('password');
    const encryptBtn = document.getElementById('encryptBtn');
    const decryptBtn = document.getElementById('decryptBtn');
    const statusText = document.getElementById('status');
    const videoPlayer = document.getElementById('videoPlayer');

    // Helper: Download ArrayBuffer as file
    function downloadBlob(buffer, filename) {
      const blob = new Blob([buffer]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Encrypt Workflow
    encryptBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      const password = passwordInput.value;

      if (!file || !password) {
        alert("Please select a file and enter a password.");
        return;
      }

      statusText.textContent = "Encrypting...";
      
      const fileBuffer = await file.arrayBuffer();
      const encryptedBuffer = await MediaEncryptor.encrypt(fileBuffer, password);
      
      downloadBlob(encryptedBuffer, file.name + ".enc");
      statusText.textContent = "Encryption complete! File downloaded.";
    });

    // Decrypt Workflow
    decryptBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      const password = passwordInput.value;

      if (!file || !password) {
        alert("Please select an encrypted file and enter the password.");
        return;
      }

      statusText.textContent = "Decrypting...";

      try {
        const fileBuffer = await file.arrayBuffer();
        const decryptedBuffer = await MediaEncryptor.decrypt(fileBuffer, password);

        // Convert decrypted ArrayBuffer directly into a playable Blob URL
        const blob = new Blob([decryptedBuffer], { type: 'video/mp4' });
        const videoUrl = URL.createObjectURL(blob);

        videoPlayer.src = videoUrl;
        videoPlayer.style.display = 'block';
        videoPlayer.play();
        statusText.textContent = "Decryption successful!";
      } catch (err) {
        statusText.textContent = err.message;
        videoPlayer.style.display = 'none';
      }
    });
  </script>
</body>
</html>
