    <script>
        (function injectGlobalMCLogger() {
            const globalObj = typeof window !== 'undefined' ? window : global;
            if (globalObj.console.__isMinecraftified) return;

            globalObj.mcLogHistory = [];
            const MAX_LOGS = 20;

            const original = {
                log: globalObj.console.log,
                info: globalObj.console.info,
                warn: globalObj.console.warn,
                error: globalObj.console.error
            };

            globalObj.originalConsole = original;

            const colors = {
                INFO: 'color: white; font-weight: normal !important; text-decoration: none;',
                WARN: 'color: #FFAA00; font-weight: normal !important;',
                ERROR: 'color: #FF5555; font-weight: normal !important;'
            };

            const getCallerFile = () => {
                try {
                    const stack = new Error().stack.split('\n');
                    // Filter out all internal logger helper lines
                    const callerLine = stack.find(line => 
                        line.includes('http') && 
                        !line.includes('getCallerFile') && 
                        !line.includes('formatAndHideLink') && 
                        !line.includes('globalObj.console') &&
                        !line.includes('injectGlobalMCLogger')
                    );
                    if (!callerLine) return "Client";

                    // Regex matches the filename (ignoring .js extension if you want, or keeping it), line number, and column number
                    const match = callerLine.match(/\/([^\/\s?]+?)(?:\.js)?:\s*(\d+):\s*(\d+)/) || callerLine.match(/\/([^\/\s?]+?)(?:\.js)?:(\d+)/);
                    if (match) {
                        const filename = match[1];
                        const line = match[2];
                        const col = match[3] || '0';
                        return `${filename}:${line}:${col}`;
                    }
                    return "Client";
                } catch (e) { return "Server"; }
            };

            const formatAndHideLink = (isFake, fileLoc2, level, args) => {
                const time = new Date().toTimeString().split(' ')[0];
                const fileLoc = isFake ? fileLoc2 : getCallerFile();
                const tag = `[${time}] [${fileLoc}/${level.toUpperCase()}]:`;
                
                const messageString = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
                globalObj.mcLogHistory.push(`${tag} ${messageString}`);
                if (globalObj.mcLogHistory.length > MAX_LOGS) globalObj.mcLogHistory.shift();
                console.groupCollapsed(`%c${tag} ${messageString}`, colors[level.toUpperCase()] || colors.INFO);
                original[level](...args);
                
                // Clean up the manual stack trace output
                const trace = new Error();
                const cleanStack = trace.stack.split('\n')
                    .filter(line => 
                        !line.includes('formatAndHideLink') && 
                        !line.includes('globalObj.console') &&
                        !line.includes('injectGlobalMCLogger') &&
                        !line.includes('Error') // Removes the initial 'Error' string line
                    )
                    .join('\n');

                original.log("Trace:\n", cleanStack);
                
                if (performance.memory) {
                    original.log("Memory Usage (at time of logging):", `${Math.round(performance.memory.usedJSHeapSize / 1048576)} MB`);
                }
                console.groupEnd();
            };

            globalObj.console.log = (...args) => { 
              formatAndHideLink(false, null, 'info', args); 
              const logEvent = new CustomEvent('logOccured', {
                detail: args.join(' ')
              });
              document.dispatchEvent(logEvent);
            };
            globalObj.console.info = (...args) => { 
              formatAndHideLink(false, null, 'info', args); 
              const logEvent = new CustomEvent('logOccured', {
                detail: args.join(' ')
              });
              document.dispatchEvent(logEvent);
            };
            globalObj.console.warn = (...args) => {
              formatAndHideLink(false, null, 'warn', args);
              const warnEvent = new CustomEvent('warnOccured', {
                detail: args.join(' ')
              });
              document.dispatchEvent(warnEvent);
            };
            globalObj.console.error = (...args) => {
              formatAndHideLink(false, null, 'error', args);
              const errorEvent = new CustomEvent('errorOccured', {
                detail: args.join(' ')
              });
              document.dispatchEvent(errorEvent);
            };
            globalObj.console.fakeLog = (logL, ...args) => formatAndHideLink(true, logL, 'info', args);
            globalObj.console.fakeError = (logL, ...args) => formatAndHideLink(true, logL, 'error', args);
            globalObj.console.fakeWarn = (logL, ...args) => formatAndHideLink(true, logL, 'warn', args);

            globalObj.console.__isMinecraftified = true;
        })();
    </script>

<script>
const WindowManager = (function () {
  let highestZIndex = 100;
  let stylesInjected = false;

  // Dynamically inject CSS styles into the <head>
  function injectStyles() {
    if (stylesInjected) return;
    stylesInjected = true;

    const css = `
      .win-container {
        position: absolute;
        background: #ffffff;
        border: 1px solid #b2b2b2;
        border-radius: 6px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 150px;
        min-height: 100px;
        user-select: none;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .win-titlebar {
        background: linear-gradient(to bottom, #ececec 0%, #d8d8d8 100%);
        border-bottom: 1px solid #b5b5b5;
        padding: 6px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: move;
        font-size: 13px;
        font-weight: 600;
        color: #4a4a4a;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      .win-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .win-close {
        width: 14px;
        height: 14px;
        line-height: 12px;
        text-align: center;
        font-size: 14px;
        font-weight: bold;
        color: #777;
        cursor: pointer;
        border-radius: 3px;
      }

      .win-close:hover {
        color: #000;
        background: rgba(0, 0, 0, 0.1);
      }

      .win-body {
        padding: 16px;
        flex: 1;
        overflow: auto;
        user-select: none;
        font-size: 15px;
      }

      .win-resize-handle {
        position: absolute;
        width: 12px;
        height: 12px;
        right: 0;
        bottom: 0;
        cursor: se-resize;
      }

      button {
        background: linear-gradient(to bottom, #ececec 0%, #d8d8d8 100%);
        border: 1px solid #b5b5b5;
        border-radius: 3px;
        padding: 5px 15px;
        cursor: pointer;
        font-weight: 600;
        color: #4a4a4a;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      button:hover {
        background: linear-gradient(to bottom, #d8d8d8 0%, #c4c4c4 100%);
      }
    `;

    const styleEl = document.createElement("style");
    styleEl.type = "text/css";
    styleEl.appendChild(document.createTextNode(css));
    document.head.appendChild(styleEl);
  }

  class WindowInstance {
    constructor(options = {}) {
      injectStyles();

      this.titleText = options.title || "Window";
      this.width = options.width || 320;
      this.height = options.height || 220;
      this.x = options.x !== undefined ? options.x : 50;
      this.y = options.y !== undefined ? options.y : 50;
      this.content = options.content || "";
      this.closable = options.closable || true;
      this.resizeable = options.resizeable || true;
      this.isHidden = options.hidden || false;
      this.noOverflow = options.noOverflow || false;
      this.hideOnClose = options.hideOnClose || false;

      this._createDOM();
      this._initEvents();
      this.bringToFront();
    }

    _createDOM() {
      // Main window container
      this.el = document.createElement("div");
      this.el.className = "win-container";
      this.el.style.width = this.width + "px";
      this.el.style.height = this.height + "px";
      this.el.style.left = this.x + "px";
      this.el.style.top = this.y + "px";

      // Titlebar
      this.titleBar = document.createElement("div");
      this.titleBar.className = "win-titlebar";

      this.titleEl = document.createElement("span");
      this.titleEl.className = "win-title";
      this.titleEl.innerHTML = this.titleText;

      this.titleBar.appendChild(this.titleEl);

      if (this.closable) {
        this.closeBtn = document.createElement("span");
        this.closeBtn.className = "win-close";
        this.closeBtn.innerHTML = "&#10005;"; // '✖' icon
        this.titleBar.appendChild(this.closeBtn);
      }

      // Content body
      this.bodyEl = document.createElement("div");
      this.bodyEl.style.overflow = this.noOverflow ? "hidden" : "auto";
      this.bodyEl.className = "win-body";
      this.setContent(this.content);

      // Resize Handle
      if (this.resizeable) {
        this.resizeHandle = document.createElement("div");
        this.resizeHandle.className = "win-resize-handle";
      }

      // Assemble window
      this.el.appendChild(this.titleBar);
      this.el.appendChild(this.bodyEl);
      if (this.resizeable) this.el.appendChild(this.resizeHandle);

      document.body.appendChild(this.el);
    }

    _initEvents() {
      // Focus on click
      this.el.addEventListener("mousedown", (event) => {
        event.stopImmediatePropagation();
        this.bringToFront();
      });

      // Close button
      if (this.closeBtn) {
        this.closeBtn.addEventListener("click", (event) => {
          event.stopImmediatePropagation();
          this.close();
        });
      }

      // Dragging logic
      let isDragging = false;
      let dragStartX, dragStartY, initialX, initialY;

      this.titleBar.addEventListener("mousedown", (e) => {
        e.stopImmediatePropagation();
        if (e.target === this.closeBtn) return;
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        initialX = this.el.offsetLeft;
        initialY = this.el.offsetTop;

        const onMouseMove = (moveEvent) => {
          if (!isDragging) return;
          const dx = moveEvent.clientX - dragStartX;
          const dy = moveEvent.clientY - dragStartY;
          this.el.style.left = `${initialX + dx}px`;
          this.el.style.top = `${initialY + dy}px`;
        };

        const onMouseUp = () => {
          isDragging = false;
          document.removeEventListener("mousemove", onMouseMove);
          document.removeEventListener("mouseup", onMouseUp);
        };

        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      });

      // Resizing logic
      let isResizing = false;
      let resizeStartX, resizeStartY, initialWidth, initialHeight;

      if (this.resizeHandle) {
        this.resizeHandle.addEventListener("mousedown", (e) => {
          e.stopPropagation();
          isResizing = true;
          resizeStartX = e.clientX;
          resizeStartY = e.clientY;
          initialWidth = this.el.offsetWidth;
          initialHeight = this.el.offsetHeight;

          const onMouseMove = (moveEvent) => {
            if (!isResizing) return;
            const newWidth = Math.max(150, initialWidth + (moveEvent.clientX - resizeStartX));
            const newHeight = Math.max(100, initialHeight + (moveEvent.clientY - resizeStartY));
            this.el.style.width = `${newWidth}px`;
            this.el.style.height = `${newHeight}px`;
          };

          const onMouseUp = () => {
            isResizing = false;
            document.removeEventListener("mousemove", onMouseMove);
            document.removeEventListener("mouseup", onMouseUp);
          };

          document.addEventListener("mousemove", onMouseMove);
          document.addEventListener("mouseup", onMouseUp);
        });
      }
      if (this.isHidden) {
        this.el.style.display = "none";
      }
    }

    setHidden(hidden) {
      this.isHidden = hidden;
      if (this.isHidden) {
        this.el.style.display = "none";
      } else {
        this.el.style.display = "flex";
      }
    }

    bringToFront() {
      highestZIndex += 1;
      this.el.style.zIndex = highestZIndex;
    }

    setContent(htmlOrNode) {
      if (typeof htmlOrNode === "string") {
        this.bodyEl.innerHTML = htmlOrNode;
      } else if (htmlOrNode instanceof HTMLElement) {
        this.bodyEl.innerHTML = "";
        this.bodyEl.appendChild(htmlOrNode);
      }
    }

    setTitle(text) {
      this.titleEl.textContent = text;
    }

    close() {
      if (this.hideOnClose) {
        this.setHidden(true);
        return;
      }
      if (this.el && this.el.parentNode) {
        this.el.parentNode.removeChild(this.el);
      }
    }
  }

  return {
    create: (options) => new WindowInstance(options)
  };

  window.WindowManager = this;
})();
</script>

<script>
// Chromebooks and some international layouts don't report the backtick key as
// "`" (it can arrive as "~" or even "Dead"), so match the physical key too.
function isDevtoolsShortcut(event) {
  if (!event.ctrlKey || event.altKey || event.metaKey) return false;
  return event.code === 'Backquote'
    || event.key === '`'
    || event.key === '~'
    || (event.key === 'Dead' && event.code === 'Backquote')
    || event.keyCode === 192;
}
window.isDevtoolsShortcut = isDevtoolsShortcut;

// TinyTools (Integrated)
window.devtoolsWindow = WindowManager.create({
  title: `TinyTools (Integrated) - <a href="#" onclick="window.openTinyToolsAbout(); return false;">About</a>`,
  x: 90,
  y: 60,
  width: 820,
  height: 470,
  hidden: true,
  hideOnClose: true,
  content: `
    <div style="display:flex;flex-direction:column;height:100%;min-height:0;">
      <div id="loggerWindowElements" style="margin:0;padding:0;white-space:pre-line;flex:1;min-height:0;overflow:auto;user-select:text;"></div>
      <div style="display:flex;gap:6px;margin-top:8px;flex:none;">
        <input id="tinyConsoleInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter JavaScript (variables persist)" style="flex:1;min-width:0;padding:5px 8px;user-select:text;border:1px solid #b5b5b5;border-radius:4px;background:linear-gradient(to bottom, #d0d0d0 0%, #f4f4f4 100%);box-shadow:inset 0 1px 3px rgba(0,0,0,0.18);outline:none;" />
        <button type="button" id="tinyConsoleSend" style="padding:4px 14px;">Send</button>
      </div>
    </div>
  `
});

// TinyTools JS console: executes in the page's real global scope. Expressions
// are evaluated for their value; everything else is injected as a script so
// top-level var/let/const/function/class declarations persist between runs.
(function setupTinyToolsConsole() {
  const logEl = document.getElementById('loggerWindowElements');
  const input = document.getElementById('tinyConsoleInput');
  const sendBtn = document.getElementById('tinyConsoleSend');
  if (!logEl || !input) return;

  const history = [];
  let historyIndex = 0;
  let scriptRun = 0;

  function appendLog(text, color, weight) {
    const line = document.createElement('div');
    line.textContent = text;
    line.style.padding = '2px 0';
    line.style.borderBottom = '1px solid lightgrey';
    if (color) line.style.color = color;
    if (weight) line.style.fontWeight = weight;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function formatValue(value, depth, seen) {
    depth = depth || 0;
    if (typeof value === 'string') return JSON.stringify(value);
    if (typeof value === 'undefined') return 'undefined';
    if (typeof value === 'function') return value.toString();
    if (value === null) return 'null';
    if (typeof value !== 'object') return String(value);

    if (value === window) return '[object Window]';
    if (value instanceof Error) return formatError(value);
    if (value instanceof RegExp) return String(value);
    if (value instanceof Node) {
      if (value instanceof Element) return value.outerHTML.slice(0, 4000);
      return String(value);
    }
    if (value instanceof Date) {
      try { return value.toISOString(); } catch (e) { return String(value); }
    }

    const tag = Object.prototype.toString.call(value);
    if (tag === '[object Map]') return 'Map(' + value.size + ')';
    if (tag === '[object Set]') return 'Set(' + value.size + ')';

    const isArray = Array.isArray(value);
    let isPlain = false;
    try {
      const proto = Object.getPrototypeOf(value);
      isPlain = proto === Object.prototype || proto === null;
    } catch (e) {}

    // Never walk into host objects or class instances: that can touch huge
    // getter graphs (window, document, app, ...) and freeze the page.
    if (!isArray && !isPlain) {
      const ctor = value.constructor && value.constructor.name;
      return '[object ' + (ctor || 'Object') + ']';
    }

    if (depth >= 2) return isArray ? '[Array]' : '{…}';

    seen = seen || new WeakSet();
    if (seen.has(value)) return '[Circular]';
    seen.add(value);

    const indent = '  '.repeat(depth + 1);
    const closing = '  '.repeat(depth);

    if (isArray) {
      const items = value.slice(0, 50).map(item => formatValue(item, depth + 1, seen));
      if (value.length > 50) items.push('… ' + (value.length - 50) + ' more');
      return '[\n' + indent + items.join(',\n' + indent) + '\n' + closing + ']';
    }

    const keys = Object.keys(value);
    if (keys.length === 0) return '{}';
    const entries = keys.slice(0, 50).map(key => {
      let formatted;
      try {
        formatted = formatValue(value[key], depth + 1, seen);
      } catch (e) {
        formatted = '[Thrown: ' + (e && e.message ? e.message : e) + ']';
      }
      return JSON.stringify(key) + ': ' + formatted;
    });
    if (keys.length > 50) entries.push('… ' + (keys.length - 50) + ' more');
    return '{\n' + indent + entries.join(',\n' + indent) + '\n' + closing + '}';
  }

  function appendResult(value) {
    if (value && typeof value.then === 'function') {
      appendLog('Promise { <pending> }', '#888');
      value.then(
        resolved => appendLog('Promise resolved: ' + formatValue(resolved), '#1f6f3f'),
        rejected => appendLog('Promise rejected: ' + formatValue(rejected), '#b00020')
      );
      return;
    }
    appendLog(formatValue(value));
  }

  function formatError(err) {
    if (!err) return 'Error';
    const header = (err.name || 'Error') + ': ' + (err.message || String(err));
    if (typeof err.stack !== 'string') return header;
    const frames = err.stack.split('\n').filter(line => {
      if (!/^\s*at /.test(line)) return false;
      // Hide the console harness frames; keep frames from the user's code.
      return !/at eval \(eval at /.test(line) &&
        !/at (?:execute|submit|runAsScript|setupTinyToolsConsole) \(.*\.html/.test(line) &&
        !/at HTMLInputElement\./.test(line);
    });
    return [header, ...frames].join('\n');
  }

  function appendError(err) {
    appendLog(formatError(err), '#b00020');
  }

  function runAsScript(code, deferErrors) {
    let error = null;
    const onError = event => {
      error = event.error || new Error(event.message);
    };
    window.addEventListener('error', onError, true);
    try {
      const script = document.createElement('script');
      script.textContent = code + '\n//# sourceURL=ttc' + (++scriptRun) + '.js';
      (document.head || document.documentElement).appendChild(script);
      script.remove();
    } catch (err) {
      error = err;
    } finally {
      window.removeEventListener('error', onError, true);
    }
    if (error && !deferErrors) appendError(error);
    return error;
  }

  function execute(code) {
    if (!code || !code.trim()) return;
    appendLog(code, '#1f6f3f', '700');

    // Don't evaluate function/class/variable declarations as expressions:
    // that would create throwaway expressions instead of persistent globals.
    const withoutLeadingComments = code.replace(/^(?:\s|\/\/[^\n]*\n|\/\*[\s\S]*?\*\/)*/, '');
    const isDeclaration = /^(?:var|let|const|function|class|async\s+function|import|export)\b/.test(withoutLeadingComments);
    const isStatement = /^(?:if|for|while|do|switch|try|throw|return|break|continue|debugger|with)\b|^\{/.test(withoutLeadingComments);

    if (isDeclaration || isStatement) {
      runAsScript(code);
      return;
    }

    // Evaluate as a single expression via a real script (not eval) so error
    // stacks point at the console source instead of the host HTML.
    const expression = code.replace(/;\s*$/, '');
    const resultKey = '__tinytoolsConsoleResult' + (++scriptRun);
    const wrapped = 'window[' + JSON.stringify(resultKey) + '] = (\n' + expression + '\n);';
    const error = runAsScript(wrapped, true);

    if (!error) {
      const value = window[resultKey];
      try { delete window[resultKey]; } catch (e) {}
      appendResult(value);
    } else if (error.name === 'SyntaxError' || /SyntaxError/.test(error.message || '')) {
      // Not a single expression - run the whole thing as statements.
      runAsScript(code);
    } else {
      appendError(error);
    }
  }

  function submit() {
    const code = input.value;
    if (!code.trim()) return;
    history.push(code);
    historyIndex = history.length;
    input.value = '';
    execute(code);
  }

  if (sendBtn) {
    sendBtn.addEventListener('click', () => {
      submit();
      input.focus();
    });
  }

  input.addEventListener('keydown', event => {
    // Let the global Ctrl+` shortcut through so the window can be toggled.
    if (isDevtoolsShortcut(event)) return;
    event.stopPropagation();
    if (event.key === 'Enter') {
      event.preventDefault();
      submit();
    } else if (event.key === 'ArrowUp') {
      event.preventDefault();
      if (historyIndex > 0) {
        historyIndex -= 1;
        input.value = history[historyIndex];
      }
    } else if (event.key === 'ArrowDown') {
      event.preventDefault();
      if (historyIndex < history.length - 1) {
        historyIndex += 1;
        input.value = history[historyIndex];
      } else {
        historyIndex = history.length;
        input.value = '';
      }
    }
  });
  input.addEventListener('keyup', event => {
    if (!isDevtoolsShortcut(event)) event.stopPropagation();
  });
  input.addEventListener('keypress', event => {
    if (!isDevtoolsShortcut(event)) event.stopPropagation();
  });

  window.tinyToolsConsole = {
    run: execute,
    focus: () => input.focus()
  };
})();

// Texture atlas viewer. Run `showAtlas()` in the TinyTools console: it opens a
// window with the live atlas that can be dragged and zoomed with the wheel.
(function setupAtlasViewer() {
  function formatZoom(scale) {
    return (scale >= 1 ? scale.toFixed(1) : scale.toFixed(2)) + 'x';
  }

  window.showAtlas = function showAtlas() {
    const atlas = window.app && window.app.worldRenderer
      ? window.app.worldRenderer.textureAtlas
      : null;
    const source = atlas && atlas.canvas;

    const win = WindowManager.create({
      title: 'Texture atlas',
      x: 140,
      y: 60,
      width: 620,
      height: 620,
      noOverflow: true,
      content: `
        <div style="position:relative;height:100%;background:#111;overflow:hidden;">
          <canvas id="atlasViewCanvas" style="display:block;width:100%;height:100%;cursor:grab;touch-action:none;"></canvas>
          <div id="atlasViewHud" style="position:absolute;left:6px;bottom:6px;font:11px monospace;color:#ddd;background:rgba(0,0,0,0.55);padding:2px 6px;border-radius:3px;pointer-events:none;white-space:nowrap;"></div>
        </div>`
    });

    const canvas = win.bodyEl.querySelector('#atlasViewCanvas');
    const hud = win.bodyEl.querySelector('#atlasViewHud');
    const ctx = canvas.getContext('2d');

    // View transform: zoom, plus where the atlas' top-left corner sits on the
    // canvas. Everything is in device pixels so the texels stay square.
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let framed = false;

    function devicePixelRatio() {
      return window.devicePixelRatio || 1;
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = devicePixelRatio();
      const width = Math.max(1, Math.round(rect.width * dpr));
      const height = Math.max(1, Math.round(rect.height * dpr));

      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }

      if (!framed) frameAtlas();
    }

    function frameAtlas() {
      if (!source || !source.width || !canvas.width) return;

      const fit = Math.min(canvas.width / source.width, canvas.height / source.height) * 0.92;
      scale = fit > 0 ? fit : 1;
      offsetX = (canvas.width - source.width * scale) / 2;
      offsetY = (canvas.height - source.height * scale) / 2;
      framed = true;
    }

    function updateHud() {
      if (!source) {
        hud.textContent = 'Texture atlas not loaded yet';
        return;
      }
      hud.textContent = `${source.width}x${source.height} \u00b7 ${formatZoom(scale)} \u00b7 drag to pan, wheel to zoom`;
    }

    function draw() {
      if (!win.el.isConnected) return;

      resize();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (source) {
        // Nearest while zoomed in, so individual texels stay legible.
        ctx.imageSmoothingEnabled = scale < 1;
        ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);
        ctx.drawImage(source, 0, 0);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }

      updateHud();
      requestAnimationFrame(draw);
    }

    canvas.addEventListener('wheel', (event) => {
      event.preventDefault();
      if (!source) return;

      const rect = canvas.getBoundingClientRect();
      const dpr = devicePixelRatio();
      const pointerX = (event.clientX - rect.left) * dpr;
      const pointerY = (event.clientY - rect.top) * dpr;

      const next = Math.min(64, Math.max(0.02, scale * Math.exp(-event.deltaY * 0.0015)));
      const applied = next / scale;

      // Keep the texel under the cursor in place while zooming.
      offsetX = pointerX - (pointerX - offsetX) * applied;
      offsetY = pointerY - (pointerY - offsetY) * applied;
      scale = next;
    }, { passive: false });

    canvas.addEventListener('mousedown', (event) => {
      event.preventDefault();
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      canvas.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (event) => {
      if (!dragging || !win.el.isConnected) return;

      const dpr = devicePixelRatio();
      offsetX += (event.clientX - lastX) * dpr;
      offsetY += (event.clientY - lastY) * dpr;
      lastX = event.clientX;
      lastY = event.clientY;
    });

    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      canvas.style.cursor = 'grab';
    });

    // Double-click refits the whole atlas in the window.
    canvas.addEventListener('dblclick', () => {
      framed = false;
      frameAtlas();
    });

    requestAnimationFrame(draw);
    return win;
  };
})();

// New Update prompt for standalone file:// builds. Connects to the data-store
// websocket, which expects a plain filename and replies with a JSON object:
// { path, contentType, encoding, content }.
(function setupFileUpdateCheck() {
  if (window.location.protocol !== 'file:') return;

  const DATASTORE_URL = 'wss://datastore.breakmine.com';
  const REQUEST_TIMEOUT_MS = 15000;

  function stripGitHash(version) {
    return String(version || '').trim().replace(/-[0-9a-f]{7,40}$/i, '');
  }

  function versionParts(version) {
    return stripGitHash(version).split('.').map(part => {
      const match = part.match(/^(\d+)([a-z]*)$/i);
      return match
        ? { number: parseInt(match[1], 10), suffix: match[2].toLowerCase() }
        : { number: 0, suffix: part.toLowerCase() };
    });
  }

  function isNewerVersion(latest, current) {
    const a = versionParts(latest);
    const b = versionParts(current);
    const length = Math.max(a.length, b.length);
    for (let i = 0; i < length; i++) {
      const left = a[i] || { number: 0, suffix: '' };
      const right = b[i] || { number: 0, suffix: '' };
      if (left.number !== right.number) return left.number > right.number;
      if (left.suffix !== right.suffix) return left.suffix > right.suffix;
    }
    return false;
  }

  function datastoreRequest(fileName, timeoutMs) {
    return new Promise((resolve, reject) => {
      let ws;
      try {
        ws = new WebSocket(DATASTORE_URL);
      } catch (err) {
        reject(err);
        return;
      }

      let settled = false;
      const finish = (err, payload) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        try { ws.close(); } catch (e) {}
        if (err) reject(err); else resolve(payload);
      };

      const timer = setTimeout(
        () => finish(new Error('Timed out waiting for ' + fileName)),
        timeoutMs || REQUEST_TIMEOUT_MS
      );

      // The server parses JSON, but falls back to treating the raw message as
      // a path; so the filename is sent on its own, exactly as it expects.
      ws.onopen = () => ws.send(fileName);
      ws.onmessage = event => {
        let payload;
        try {
          payload = JSON.parse(event.data);
        } catch (err) {
          finish(new Error('Invalid response from DataStore'));
          return;
        }
        if (payload.error) {
          finish(new Error(payload.error));
          return;
        }
        if (typeof payload.content !== 'string') {
          finish(new Error('Response from DataStore has no content'));
          return;
        }
        finish(null, payload);
      };
      ws.onerror = () => finish(new Error('Could not connect to DataStore'));
      ws.onclose = () => finish(new Error('DataStore connection closed'));
    });
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function showUpdateWindow(current, latest) {
    const win = WindowManager.create({
      title: 'New Update',
      x: 560,
      y: 100,
      width: 400,
      height: 215,
      resizeable: false,
      closable: false,
      noOverflow: true,
      content: `
        <div style="display:flex;flex-direction:column;height:100%;">
          <p style="margin:0;">
            A new version of Breakmine is available.<br><br>
            <b>Current:</b> ${escapeHtml(stripGitHash(current))}<br>
            <b>New:</b> ${escapeHtml(latest)}
          </p>
          <p id="updateStatus" style="margin:8px 0 0;color:#666;min-height:1.2em;"></p>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:auto;padding-top:10px;">
            <button type="button" id="updateLater">Later</button>
            <button type="button" id="updateDownload">Attempt to Download</button>
          </div>
        </div>`
    });

    const status = document.getElementById('updateStatus');
    const downloadButton = document.getElementById('updateDownload');

    document.getElementById('updateLater').addEventListener('click', () => win.close());
    downloadButton.addEventListener('click', async () => {
      downloadButton.disabled = true;
      status.textContent = 'Downloading new version...';
      try {
        const file = await datastoreRequest('index.html', 120000);
        let blob;
        if (file.encoding === 'base64') {
          const bytes = Uint8Array.from(atob(file.content), ch => ch.charCodeAt(0));
          blob = new Blob([bytes], { type: file.contentType || 'text/html' });
        } else {
          blob = new Blob([file.content], { type: file.contentType || 'text/html' });
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = file.path ? file.path.split('/').pop() : 'index.html';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);

        status.textContent = 'You can download again if you\'d like.';
        downloadButton.textContent = 'Download again';
        downloadButton.disabled = false;
      } catch (err) {
        status.textContent = 'Download failed: ' + ((err && err.message) || err);
        downloadButton.disabled = false;
      }
    });
  }

  function checkForUpdate() {
    const current = window.GAME_VERSION;
    if (!current) return;

    datastoreRequest('version.txt').then(file => {
      const latest = String(file.content || '').trim();
      if (latest && isNewerVersion(latest, current)) {
        showUpdateWindow(current, latest);
      }
    }).catch(err => {
      console.warn('[update] check failed:', (err && err.message) || err);
    });
  }

  if (document.readyState === 'complete') {
    checkForUpdate();
  } else {
    window.addEventListener('load', checkForUpdate, { once: true });
  }
})();

// --- Breakmine admin panel (devtools) ---------------------------------------
// Run `admin()` in the TinyTools console (Ctrl+`) to open it. The rendered
// api.breakmine.com/admin page cannot be embedded here: it is served with
// X-Frame-Options: SAMEORIGIN and a SameSite=Strict cookie, so a cross-origin
// frame could neither display it nor keep its session. This window talks to the
// JSON admin API (/api/admin/*) instead, using the same admin password.
(function setupAdminPanel() {
  const TOKEN_KEY = 'breakmine_admin_token';
  const API_KEY = 'breakmine_admin_api';
  const GAME_SETTINGS_KEY = 'breakmine_settings';
  const PROD_API = 'https://api.breakmine.com';
  const MAX_PLAYER_ROWS = 500;

  let panelWindow = null;
  let viewEl = null;
  let state = null;
  let tab = 'capes';
  let notice = null;
  // Codes minted during this session, keyed by cape id, so the admin can copy
  // them before they are lost (the server only stores hashes-free plain codes).
  const mintedCodes = new Map();
  let busy = false;
  let token = '';
  let socket = null;
  let socketPromise = null;
  let socketRequestId = 0;
  const pending = new Map();

  // Follow the API URL the game itself is using (Options -> API URL, stored in
  // GameSettings), so the panel talks to the same server as the game instead of
  // guessing from the page hostname. Falls back to the production API.
  function gameApiUrl() {
    let raw;
    try {
      raw = localStorage.getItem(GAME_SETTINGS_KEY);
    } catch (err) {
      return '';
    }
    if (!raw) return '';

    let saved;
    try {
      saved = JSON.parse(raw);
    } catch (err) {
      return '';
    }

    const value = saved && typeof saved.apiUrl === 'string' ? saved.apiUrl.trim() : '';
    if (!value) return '';

    // Same normalisation GameSettings/AuthLib apply to the configured value.
    return /^https?:\/\//i.test(value) ? value : 'https://' + value;
  }

  function apiBase() {
    const override = window.ADMIN_API_BASE || readStorage(localStorage, API_KEY);
    if (override) return String(override).trim().replace(/\/+$/, '');

    return gameApiUrl().replace(/\/+$/, '') || PROD_API;
  }

  // The panel talks to the API over the WebSocket transport (/api-ws). The
  // server replays each frame against the same HTTP routes, so validation and
  // error shapes are identical, and filtered networks that block plain HTTP
  // still reach it.
  function wsUrl() {
    try {
      const url = new URL(apiBase());
      url.protocol = url.protocol === 'http:' ? 'ws:' : 'wss:';
      url.pathname = '/api-ws';
      url.search = '';
      url.hash = '';
      return url.toString();
    } catch (err) {
      return '';
    }
  }

  function failPending(message) {
    for (const entry of pending.values()) {
      clearTimeout(entry.timer);
      entry.reject(new Error(message));
    }
    pending.clear();
  }

  function ensureSocket() {
    if (socket && socket.readyState === WebSocket.OPEN) return Promise.resolve(socket);
    if (socketPromise) return socketPromise;

    socketPromise = new Promise((resolve, reject) => {
      let ws;
      try {
        ws = new WebSocket(wsUrl());
      } catch (err) {
        socketPromise = null;
        reject(new Error('Cannot open ' + wsUrl()));
        return;
      }

      const timer = setTimeout(() => {
        socketPromise = null;
        try { ws.close(); } catch (err) { /* ignore */ }
        reject(new Error('Admin socket timed out'));
      }, 10000);

      ws.onopen = () => {
        clearTimeout(timer);
        socket = ws;
        socketPromise = null;
        resolve(ws);
      };

      ws.onerror = () => {
        clearTimeout(timer);
        socketPromise = null;
        reject(new Error('Cannot reach ' + wsUrl()));
      };

      ws.onclose = () => {
        socket = null;
        socketPromise = null;
        failPending('Admin socket closed');
      };

      ws.onmessage = (event) => {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch (err) {
          return;
        }
        const entry = pending.get(String(message.id));
        if (!entry) return;
        pending.delete(String(message.id));
        clearTimeout(entry.timer);
        entry.resolve(message);
      };
    });

    return socketPromise;
  }

  function readStorage(store, key) {
    try {
      return store.getItem(key) || '';
    } catch (err) {
      return '';
    }
  }

  function writeStorage(store, key, value) {
    try {
      if (value) store.setItem(key, value);
      else store.removeItem(key);
    } catch (err) {
      // Storage can be unavailable (private mode, file:// sandboxes).
    }
  }

  function storeToken(value) {
    token = value || '';
    writeStorage(sessionStorage, TOKEN_KEY, token);
  }

  function esc(value) {
    return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function formatDate(value, fallback) {
    if (!value) return fallback;
    try {
      return new Date(value).toLocaleString();
    } catch (err) {
      return fallback;
    }
  }

  async function request(path, options) {
    const method = (options && options.method) || 'GET';
    const headers = {};
    let body;

    if (options && options.body !== undefined) {
      headers['content-type'] = 'application/json';
      body = JSON.stringify(options.body);
    }
    if (token) headers.authorization = 'Bearer ' + token;

    const ws = await ensureSocket();
    const id = String(++socketRequestId);

    const reply = await new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error('Admin request timed out'));
      }, 20000);

      pending.set(id, { resolve, reject, timer });
      try {
        ws.send(JSON.stringify({ id, method, path, headers, body }));
      } catch (err) {
        clearTimeout(timer);
        pending.delete(id);
        reject(new Error('Could not send the admin request'));
      }
    });

    if (reply.error) throw new Error(reply.error);
    if (reply.status >= 400) {
      const error = new Error((reply.json && reply.json.error) || reply.error || 'Request failed (' + reply.status + ')');
      error.status = reply.status;
      throw error;
    }

    return reply.json || {};
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      if (!file || !file.size) {
        reject(new Error('Choose a PNG file.'));
        return;
      }
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(new Error('Could not read that file.'));
      reader.readAsDataURL(file);
    });
  }

  function messageHtml() {
    return notice
      ? '<div class="bmadmin-msg ' + (notice.kind || 'ok') + '">' + esc(notice.text) + '</div>'
      : '';
  }

  function renderLogin() {
    return `<div class="bmadmin">
      <form class="bmadmin-card" data-act="login">
        <h2>Breakmine Admin</h2>
        <p class="bmadmin-note">Sign in with the admin password to manage capes and players.</p>
        ${messageHtml()}
        <label>Admin password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Sign in</button>
        <p class="bmadmin-note">Socket: ${esc(wsUrl())}</p>
      </form>
    </div>`;
  }

  function render() {
    if (!viewEl) return;
    viewEl.innerHTML = token ? renderPanel() : renderLogin();
  }

  function renderPanel() {
    return `<div class="bmadmin">
      <div class="bmadmin-bar">
        <div class="bmadmin-tabs">
          <button type="button" data-tab="capes" class="${tab === 'capes' ? 'on' : ''}">Capes</button>
          <button type="button" data-tab="players" class="${tab === 'players' ? 'on' : ''}">Players</button>
        </div>
        <div class="bmadmin-actions">
          <form data-act="refresh"><button type="submit">Refresh</button></form>
          <form data-act="signout"><button type="submit">Sign out</button></form>
        </div>
      </div>
      ${messageHtml()}
      ${state
        ? (tab === 'capes' ? renderCapes() : renderPlayers())
        : '<p class="bmadmin-note">Loading…</p>'}
      <p class="bmadmin-note">Socket: ${esc(wsUrl())}</p>
    </div>`;
  }

  function renderCapes() {
    const capes = state.capes || [];
    const upload = `<form class="bmadmin-upload" data-act="cape-upload">
      <label>Cape name<input type="text" name="name" maxlength="40" placeholder="e.g. Founder Cape" required></label>
      <label>Cape PNG (64×32 or HD)<input type="file" name="file" accept="image/png" required></label>
      <button type="submit">Upload cape</button>
    </form>`;

    if (capes.length === 0) {
      return upload + '<p class="bmadmin-note">No capes uploaded yet.</p>';
    }

    return upload + `<table class="bmadmin-table">
      <thead><tr><th></th><th>Cape</th><th>Assigned players</th><th></th></tr></thead>
      <tbody>${capes.map(renderCapeRow).join('')}</tbody>
    </table>`;
  }

  function renderCapeRow(cape) {
    const id = esc(cape.id);
    const counts = cape.codeCounts || { total: 0, unused: 0 };
    const minted = mintedCodes.get(cape.id) || [];
    const codeSummary = counts.total === 0
      ? 'No gift codes yet'
      : counts.unused + ' unused of ' + counts.total + ' code' + (counts.total === 1 ? '' : 's');
    const mintedHtml = minted.length === 0
      ? ''
      : '<div class="bmadmin-codes">' + minted.map((code) => '<code>' + esc(code) + '</code>').join('') + '</div>';
    const pills = cape.assigned.length === 0
      ? '<span class="bmadmin-note">Not assigned to anyone</span>'
      : cape.assigned.map((username) => `<form class="bmadmin-inline" data-act="cape-unassign" data-id="${id}" data-username="${esc(username)}">
          <span class="bmadmin-pill">${esc(username)}<button type="submit" title="Unassign">×</button></span>
        </form>`).join(' ');

    const thumb = cape.texture
      ? `<img class="bmadmin-thumb" src="${esc(cape.texture)}" alt="">`
      : '<span class="bmadmin-note">—</span>';

    return `<tr>
      <td>${thumb}</td>
      <td>
        <strong>${esc(cape.name)}</strong>
        <div class="bmadmin-sub">${id}</div>
        <div class="bmadmin-note">${codeSummary}</div>
        ${mintedHtml}
      </td>
      <td>
        <div class="bmadmin-pills">${pills}</div>
        <form class="bmadmin-inline" data-act="cape-assign" data-id="${id}">
          <input type="text" name="usernames" placeholder="username, othername" required>
          <button type="submit">Assign</button>
        </form>
      </td>
      <td>
        <div class="bmadmin-actions">
          <form class="bmadmin-inline" data-act="cape-codes" data-id="${id}">
            <input type="text" name="count" value="1" size="2" inputmode="numeric" title="How many codes to mint">
            <button type="submit">Generate codes</button>
          </form>
          <form data-act="cape-list-codes" data-id="${id}"><button type="submit">Show codes</button></form>
          <form data-act="cape-assign-all" data-id="${id}"><button type="submit">Gift all</button></form>
          <form data-act="cape-unassign-all" data-id="${id}"><button type="submit">Remove all</button></form>
          <form data-act="cape-delete" data-id="${id}"><button type="submit" class="bmadmin-danger">Delete</button></form>
        </div>
      </td>
    </tr>`;
  }

  function capeOptions(user) {
    const options = [
      `<option value="default"${user.capeId === null ? ' selected' : ''}>Server default</option>`,
      `<option value="none"${user.capeId === '' ? ' selected' : ''}>No cape</option>`
    ];

    for (const cape of state.capes || []) {
      options.push(`<option value="${esc(cape.id)}"${user.capeId === cape.id ? ' selected' : ''}>${esc(cape.name)}</option>`);
    }

    return options.join('');
  }

  function renderPlayers() {
    const users = state.users || [];
    const spam = state.spam || { count: 0, neverLoggedInCount: 0 };
    const purge = `<div class="bmadmin-purge">
      <div>
        <strong>Spam cleanup</strong>
        <div class="bmadmin-note">Matches auto-generated usernames such as JumpingPotato42.</div>
      </div>
      <div class="bmadmin-actions">
        <form data-act="purge-spam" data-never="0">
          <button type="submit" class="bmadmin-danger"${spam.count === 0 ? ' disabled' : ''}>Purge spam</button>
          <span class="bmadmin-note">${spam.count} account${spam.count === 1 ? '' : 's'}</span>
        </form>
        <form data-act="purge-spam" data-never="1">
          <button type="submit" class="bmadmin-danger"${spam.neverLoggedInCount === 0 ? ' disabled' : ''}>Purge never logged in</button>
          <span class="bmadmin-note">${spam.neverLoggedInCount} account${spam.neverLoggedInCount === 1 ? '' : 's'}</span>
        </form>
      </div>
    </div>`;

    if (users.length === 0) {
      return purge + '<p class="bmadmin-note">No players registered yet.</p>';
    }

    const shown = users.slice(0, MAX_PLAYER_ROWS);
    const more = users.length > shown.length
      ? `<p class="bmadmin-note">Showing ${shown.length} of ${users.length} players. Purge spam to shorten the list.</p>`
      : '';

    return purge + `<table class="bmadmin-table">
      <thead><tr><th>Player</th><th>Created</th><th>Last login</th><th>Skin</th><th>Cape</th><th>Password</th><th></th></tr></thead>
      <tbody>${shown.map(renderPlayerRow).join('')}</tbody>
    </table>` + more;
  }

  function renderPlayerRow(user) {
    const id = esc(user.id);
    const name = esc(user.username);

    return `<tr>
      <td><strong>${name}</strong><div class="bmadmin-sub">${id}</div></td>
      <td>${esc(formatDate(user.createdAt, '—'))}</td>
      <td>${esc(formatDate(user.lastLogin, 'Never'))}</td>
      <td>
        <div class="bmadmin-sub">${user.hasSkin ? 'Custom skin' : 'Default skin'}</div>
        <form class="bmadmin-inline" data-act="user-skin" data-id="${id}">
          <input type="file" name="file" accept="image/png" required>
          <button type="submit">Upload</button>
        </form>
        ${user.hasSkin ? `<form data-act="user-skin-reset" data-id="${id}"><button type="submit">Reset skin</button></form>` : ''}
      </td>
      <td>
        <form class="bmadmin-inline" data-act="user-cape" data-id="${id}">
          <select name="capeId">${capeOptions(user)}</select>
          <button type="submit">Apply</button>
        </form>
      </td>
      <td>
        <form class="bmadmin-inline" data-act="user-password" data-id="${id}">
          <input type="password" name="password" minlength="6" maxlength="128" placeholder="New password" autocomplete="new-password" required>
          <button type="submit">Set</button>
        </form>
      </td>
      <td><form data-act="user-delete" data-id="${id}" data-username="${name}"><button type="submit" class="bmadmin-danger">Delete</button></form></td>
    </tr>`;
  }

  async function loadState() {
    state = await request('/api/admin/state');
    render();
  }

  async function mutate(run) {
    try {
      const result = await run();
      notice = { kind: 'ok', text: (result && result.message) || 'Done.' };
      await loadState();
    } catch (err) {
      handleError(err);
    }
  }

  function handleError(err) {
    if (err && (err.status === 401 || err.status === 403)) {
      storeToken('');
      state = null;
      notice = { kind: 'error', text: 'Admin session expired. Sign in again.' };
      render();
      return;
    }

    notice = { kind: 'error', text: (err && err.message) || 'Something went wrong.' };
    render();
  }

  async function handleForm(form) {
    if (busy) return;

    const act = form.dataset.act || '';
    const id = encodeURIComponent(form.dataset.id || '');
    const field = (name) => {
      const input = form.querySelector('[name="' + name + '"]');
      return input ? String(input.value || '').trim() : '';
    };
    const file = () => {
      const input = form.querySelector('input[type="file"]');
      return input && input.files ? input.files[0] : null;
    };

    if (act === 'signout') {
      storeToken('');
      state = null;
      tab = 'capes';
      notice = { kind: 'ok', text: 'Signed out.' };
      render();
      return;
    }

    busy = true;
    try {
      switch (act) {
        case 'login': {
          const password = field('password');
          if (!password) return;
          const result = await request('/api/admin/login', { method: 'POST', body: { password } });
          storeToken(result.token);
          notice = { kind: 'ok', text: 'Signed in.' };
          await loadState();
          return;
        }

        case 'refresh':
          notice = null;
          await loadState();
          return;

        case 'cape-upload':
          await mutate(async () => {
            const png = await fileToDataUrl(file());
            return request('/api/admin/capes', { method: 'POST', body: { name: field('name'), png } });
          });
          return;

        case 'cape-assign':
          await mutate(() => request('/api/admin/capes/' + id + '/assign', {
            method: 'POST', body: { usernames: field('usernames') }
          }));
          return;

        case 'cape-unassign':
          await mutate(() => request('/api/admin/capes/' + id + '/unassign', {
            method: 'POST', body: { username: form.dataset.username || '' }
          }));
          return;

        case 'cape-assign-all':
          if (!confirm('Gift this cape to every registered player?')) return;
          await mutate(() => request('/api/admin/capes/' + id + '/assign-all', { method: 'POST', body: {} }));
          return;

        case 'cape-unassign-all':
          if (!confirm('Remove this cape from every player it is assigned to?')) return;
          await mutate(() => request('/api/admin/capes/' + id + '/unassign-all', { method: 'POST', body: {} }));
          return;

        case 'cape-codes': {
          const count = Math.min(Math.max(Number(field('count')) || 1, 1), 50);
          const result = await request('/api/admin/capes/' + id + '/codes', {
            method: 'POST', body: { count }
          });
          mintedCodes.set(form.dataset.id || '', (result && result.codes) || []);
          notice = { kind: 'ok', text: (result && result.message) || 'Codes generated.' };
          await loadState();
          return;
        }

        case 'cape-list-codes': {
          const result = await request('/api/admin/capes/' + id + '/codes');
          const all = (result && result.codes) || [];
          const unused = all.filter((entry) => !entry.redeemed_by).map((entry) => entry.code);
          mintedCodes.set(form.dataset.id || '', unused);
          notice = {
            kind: 'ok',
            text: unused.length === 0
              ? 'No unused codes for this cape.'
              : unused.length + ' unused code' + (unused.length === 1 ? '' : 's') + ' of ' + all.length + ' total.'
          };
          render();
          return;
        }

        case 'cape-delete':
          if (!confirm('Delete this cape and unassign it from everyone?')) return;
          await mutate(() => request('/api/admin/capes/' + id, { method: 'DELETE' }));
          return;

        case 'user-cape':
          await mutate(() => request('/api/admin/users/' + id + '/cape', {
            method: 'POST', body: { capeId: field('capeId') }
          }));
          return;

        case 'user-password':
          await mutate(() => request('/api/admin/users/' + id + '/password', {
            method: 'POST', body: { password: field('password') }
          }));
          return;

        case 'user-skin':
          await mutate(async () => {
            const png = await fileToDataUrl(file());
            return request('/api/admin/users/' + id + '/skin', { method: 'POST', body: { png } });
          });
          return;

        case 'user-skin-reset':
          await mutate(() => request('/api/admin/users/' + id + '/skin/reset', { method: 'POST', body: {} }));
          return;

        case 'user-delete':
          if (!confirm('Delete ' + (form.dataset.username || 'this player') + ' and all their account data?')) return;
          await mutate(() => request('/api/admin/users/' + id, { method: 'DELETE' }));
          return;

        case 'purge-spam':
          if (!confirm('Delete these spam accounts? This cannot be undone.')) return;
          await mutate(() => request('/api/admin/users/purge-spam', {
            method: 'POST', body: { neverLoggedIn: form.dataset.never === '1' }
          }));
          return;

        default:
          return;
      }
    } catch (err) {
      handleError(err);
    } finally {
      busy = false;
    }
  }

  function installStyles() {
    if (document.getElementById('bmadmin-style')) return;

    const style = document.createElement('style');
    style.id = 'bmadmin-style';
    style.textContent = `
      .bmadmin { display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: #333; user-select: text; }
      .bmadmin h2 { margin: 0 0 4px; font-size: 15px; }
      .bmadmin label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #666; }
      .bmadmin input[type=text], .bmadmin input[type=password], .bmadmin select {
        padding: 3px 5px; border: 1px solid #b5b5b5; border-radius: 3px; font: inherit; color: #333; background: #fff;
      }
      .bmadmin input[type=file] { font-size: 11px; }
      .bmadmin-card { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 40px auto 0; }
      .bmadmin-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid #d5d5d5; padding-bottom: 6px; }
      .bmadmin-tabs button.on { background: linear-gradient(to bottom, #c9c9c9 0%, #bcbcbc 100%); }
      .bmadmin-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

      .bmadmin-sub { color: #888; font-size: 10px; word-break: break-all; }
      .bmadmin-table { width: 100%; border-collapse: collapse; }
      .bmadmin-table th, .bmadmin-table td { text-align: left; padding: 6px; border-bottom: 1px solid #eee; vertical-align: top; }
      .bmadmin-table th { font-size: 11px; color: #666; }
      .bmadmin-thumb { width: 40px; height: 20px; image-rendering: pixelated; background: #111; border-radius: 3px; }
      .bmadmin-upload { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 6px; }
      .bmadmin-upload label { flex: 1 1 180px; }
      .bmadmin-purge { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px; background: #f5f5f5; border-radius: 4px; margin-bottom: 8px; }
      .bmadmin-pills { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 4px; }
      .bmadmin-pill { display: inline-flex; align-items: center; gap: 3px; background: #ececec; border-radius: 999px; padding: 1px 2px 1px 7px; }
      .bmadmin-pill button { padding: 0 4px; font-size: 12px; border: 0; background: transparent; }
      .bmadmin-danger { color: #8f1e1e; }
      .bmadmin-codes { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
      .bmadmin-codes code { background: #eef3ff; border: 1px solid #cddaf5; border-radius: 3px; padding: 1px 4px; font: 11px/1.4 ui-monospace, monospace; user-select: all; }
      .bmadmin button:disabled { opacity: 0.5; cursor: not-allowed; }
    `;
    document.head.appendChild(style);
  }

  function openAdmin() {
    if (panelWindow) {
      panelWindow.setHidden(false);
      panelWindow.bringToFront();
      if (token) loadState().catch(handleError);
      return panelWindow;
    }

    installStyles();

    panelWindow = WindowManager.create({
      title: 'Breakmine Admin',
      x: 110,
      y: 50,
      width: 840,
      height: 560,
      hideOnClose: true,
      content: '<div data-role="admin-root" class="bmadmin"></div>'
    });

    viewEl = panelWindow.bodyEl.querySelector('[data-role="admin-root"]');
    viewEl.addEventListener('submit', (event) => {
      event.preventDefault();
      handleForm(event.target);
    });
    viewEl.addEventListener('click', (event) => {
      const tabButton = event.target.closest('[data-tab]');
      if (!tabButton) return;
      tab = tabButton.dataset.tab;
      render();
    });
    ['keydown', 'keyup', 'keypress'].forEach((type) => {
      viewEl.addEventListener(type, (event) => {
        if (window.isDevtoolsShortcut && window.isDevtoolsShortcut(event)) return;
        event.stopPropagation();
      });
    });

    storeToken(readStorage(sessionStorage, TOKEN_KEY));
    render();
    if (token) loadState().catch(handleError);

    return panelWindow;
  }

  window.admin = openAdmin;
  window.adminPanel = { open: openAdmin, apiBase, wsUrl };
})();
