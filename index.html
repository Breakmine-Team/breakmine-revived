    <script>
        (function injectGlobalMCLogger() {
            const globalObj = typeof window !== 'undefined' ? window : global;
            if (globalObj.console.__isMinecraftified) return;

            globalObj.mcLogHistory = [];
            const MAX_LOGS = 20;

            const original = {
                log: globalObj.console.log,
                info: globalObj.console.info,
                warn: globalObj.console.warn,
                error: globalObj.console.error
            };

            globalObj.originalConsole = original;

            const colors = {
                INFO: 'color: white; font-weight: normal !important; text-decoration: none;',
                WARN: 'color: #FFAA00; font-weight: normal !important;',
                ERROR: 'color: #FF5555; font-weight: normal !important;'
            };

            const getCallerFile = () => {
                try {
                    const stack = new Error().stack.split('\n');
                    // Filter out all internal logger helper lines
                    const callerLine = stack.find(line => 
                        line.includes('http') && 
                        !line.includes('getCallerFile') && 
                        !line.includes('formatAndHideLink') && 
                        !line.includes('globalObj.console') &&
                        !line.includes('injectGlobalMCLogger')
                    );
                    if (!callerLine) return "Client";

                    // Regex matches the filename (ignoring .js extension if you want, or keeping it), line number, and column number
                    const match = callerLine.match(/\/([^\/\s?]+?)(?:\.js)?:\s*(\d+):\s*(\d+)/) || callerLine.match(/\/([^\/\s?]+?)(?:\.js)?:(\d+)/);
                    if (match) {
                        const filename = match[1];
                        const line = match[2];
                        const col = match[3] || '0';
                        return `${filename}:${line}:${col}`;
                    }
                    return "Client";
                } catch (e) { return "Server"; }
            };

            const formatAndHideLink = (isFake, fileLoc2, level, args) => {
                const time = new Date().toTimeString().split(' ')[0];
                const fileLoc = isFake ? fileLoc2 : getCallerFile();
                const tag = `[${time}] [${fileLoc}/${level.toUpperCase()}]:`;
                
                const messageString = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
                globalObj.mcLogHistory.push(`${tag} ${messageString}`);
                if (globalObj.mcLogHistory.length > MAX_LOGS) globalObj.mcLogHistory.shift();
                console.groupCollapsed(`%c${tag} ${messageString}`, colors[level.toUpperCase()] || colors.INFO);
                original[level](...args);
                
                // Clean up the manual stack trace output
                const trace = new Error();
                const cleanStack = trace.stack.split('\n')
                    .filter(line => 
                        !line.includes('formatAndHideLink') && 
                        !line.includes('globalObj.console') &&
                        !line.includes('injectGlobalMCLogger') &&
                        !line.includes('Error') // Removes the initial 'Error' string line
                    )
                    .join('\n');

                original.log("Trace:\n", cleanStack);
                
                if (performance.memory) {
                    original.log("Memory Usage (at time of logging):", `${Math.round(performance.memory.usedJSHeapSize / 1048576)} MB`);
                }
                console.groupEnd();
            };

            globalObj.console.log = (...args) => { 
              formatAndHideLink(false, null, 'info', args); 
              const logEvent = new CustomEvent('logOccured', {
                detail: args.join(' ')
              });
              document.dispatchEvent(logEvent);
            };
            globalObj.console.info = (...args) => { 
              formatAndHideLink(false, null, 'info', args); 
              const logEvent = new CustomEvent('logOccured', {
                detail: args.join(' ')
              });
              document.dispatchEvent(logEvent);
            };
            globalObj.console.warn = (...args) => {
              formatAndHideLink(false, null, 'warn', args);
              const warnEvent = new CustomEvent('warnOccured', {
                detail: args.join(' ')
              });
              document.dispatchEvent(warnEvent);
            };
            globalObj.console.error = (...args) => {
              formatAndHideLink(false, null, 'error', args);
              const errorEvent = new CustomEvent('errorOccured', {
                detail: args.join(' ')
              });
              document.dispatchEvent(errorEvent);
            };
            globalObj.console.fakeLog = (logL, ...args) => formatAndHideLink(true, logL, 'info', args);
            globalObj.console.fakeError = (logL, ...args) => formatAndHideLink(true, logL, 'error', args);
            globalObj.console.fakeWarn = (logL, ...args) => formatAndHideLink(true, logL, 'warn', args);

            globalObj.console.__isMinecraftified = true;
        })();
    </script>

<script>
const WindowManager = (function () {
  let highestZIndex = 100;
  let stylesInjected = false;

  // Dynamically inject CSS styles into the <head>
  function injectStyles() {
    if (stylesInjected) return;
    stylesInjected = true;

    const css = `
      .win-container {
        position: absolute;
        background: #ffffff;
        border: 1px solid #b2b2b2;
        border-radius: 6px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 150px;
        min-height: 100px;
        user-select: none;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .win-titlebar {
        background: linear-gradient(to bottom, #ececec 0%, #d8d8d8 100%);
        border-bottom: 1px solid #b5b5b5;
        padding: 6px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: move;
        font-size: 13px;
        font-weight: 600;
        color: #4a4a4a;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      .win-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .win-close {
        width: 14px;
        height: 14px;
        line-height: 12px;
        text-align: center;
        font-size: 14px;
        font-weight: bold;
        color: #777;
        cursor: pointer;
        border-radius: 3px;
      }

      .win-close:hover {
        color: #000;
        background: rgba(0, 0, 0, 0.1);
      }

      .win-body {
        padding: 16px;
        flex: 1;
        overflow: auto;
        user-select: none;
        font-size: 15px;
      }

      .win-resize-handle {
        position: absolute;
        width: 12px;
        height: 12px;
        right: 0;
        bottom: 0;
        cursor: se-resize;
      }

      button {
        background: linear-gradient(to bottom, #ececec 0%, #d8d8d8 100%);
        border: 1px solid #b5b5b5;
        border-radius: 3px;
        padding: 5px 15px;
        cursor: pointer;
        font-weight: 600;
        color: #4a4a4a;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      button:hover {
        background: linear-gradient(to bottom, #d8d8d8 0%, #c4c4c4 100%);
      }
    `;

    const styleEl = document.createElement("style");
    styleEl.type = "text/css";
    styleEl.appendChild(document.createTextNode(css));
    document.head.appendChild(styleEl);
  }

  class WindowInstance {
    constructor(options = {}) {
      injectStyles();

      this.titleText = options.title || "Window";
      this.width = options.width || 320;
      this.height = options.height || 220;
      this.x = options.x !== undefined ? options.x : 50;
      this.y = options.y !== undefined ? options.y : 50;
      this.content = options.content || "";
      this.closable = options.closable || true;
      this.resizeable = options.resizeable || true;
      this.isHidden = options.hidden || false;
      this.noOverflow = options.noOverflow || false;
      this.hideOnClose = options.hideOnClose || false;

      this._createDOM();
      this._initEvents();
      this.bringToFront();
    }

    _createDOM() {
      // Main window container
      this.el = document.createElement("div");
      this.el.className = "win-container";
      this.el.style.width = this.width + "px";
      this.el.style.height = this.height + "px";
      this.el.style.left = this.x + "px";
      this.el.style.top = this.y + "px";

      // Titlebar
      this.titleBar = document.createElement("div");
      this.titleBar.className = "win-titlebar";

      this.titleEl = document.createElement("span");
      this.titleEl.className = "win-title";
      this.titleEl.innerHTML = this.titleText;

      this.titleBar.appendChild(this.titleEl);

      if (this.closable) {
        this.closeBtn = document.createElement("span");
        this.closeBtn.className = "win-close";
        this.closeBtn.innerHTML = "&#10005;"; // '✖' icon
        this.titleBar.appendChild(this.closeBtn);
      }

      // Content body
      this.bodyEl = document.createElement("div");
      this.bodyEl.style.overflow = this.noOverflow ? "hidden" : "auto";
      this.bodyEl.className = "win-body";
      this.setContent(this.content);

      // Resize Handle
      if (this.resizeable) {
        this.resizeHandle = document.createElement("div");
        this.resizeHandle.className = "win-resize-handle";
      }

      // Assemble window
      this.el.appendChild(this.titleBar);
      this.el.appendChild(this.bodyEl);
      if (this.resizeable) this.el.appendChild(this.resizeHandle);

      document.body.appendChild(this.el);
    }

    _initEvents() {
      // Focus on click
      this.el.addEventListener("mousedown", (event) => {
        event.stopImmediatePropagation();
        this.bringToFront();
      });

      // Close button
      if (this.closeBtn) {
        this.closeBtn.addEventListener("click", (event) => {
          event.stopImmediatePropagation();
          this.close();
        });
      }

      // Dragging logic
      let isDragging = false;
      let dragStartX, dragStartY, initialX, initialY;

      this.titleBar.addEventListener("mousedown", (e) => {
        e.stopImmediatePropagation();
        if (e.target === this.closeBtn) return;
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        initialX = this.el.offsetLeft;
        initialY = this.el.offsetTop;

        const onMouseMove = (moveEvent) => {
          if (!isDragging) return;
          const dx = moveEvent.clientX - dragStartX;
          const dy = moveEvent.clientY - dragStartY;
          this.el.style.left = `${initialX + dx}px`;
          this.el.style.top = `${initialY + dy}px`;
        };

        const onMouseUp = () => {
          isDragging = false;
          document.removeEventListener("mousemove", onMouseMove);
          document.removeEventListener("mouseup", onMouseUp);
        };

        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      });

      // Resizing logic
      let isResizing = false;
      let resizeStartX, resizeStartY, initialWidth, initialHeight;

      if (this.resizeHandle) {
        this.resizeHandle.addEventListener("mousedown", (e) => {
          e.stopPropagation();
          isResizing = true;
          resizeStartX = e.clientX;
          resizeStartY = e.clientY;
          initialWidth = this.el.offsetWidth;
          initialHeight = this.el.offsetHeight;

          const onMouseMove = (moveEvent) => {
            if (!isResizing) return;
            const newWidth = Math.max(150, initialWidth + (moveEvent.clientX - resizeStartX));
            const newHeight = Math.max(100, initialHeight + (moveEvent.clientY - resizeStartY));
            this.el.style.width = `${newWidth}px`;
            this.el.style.height = `${newHeight}px`;
          };

          const onMouseUp = () => {
            isResizing = false;
            document.removeEventListener("mousemove", onMouseMove);
            document.removeEventListener("mouseup", onMouseUp);
          };

          document.addEventListener("mousemove", onMouseMove);
          document.addEventListener("mouseup", onMouseUp);
        });
      }
      if (this.isHidden) {
        this.el.style.display = "none";
      }
    }

    setHidden(hidden) {
      this.isHidden = hidden;
      if (this.isHidden) {
        this.el.style.display = "none";
      } else {
        this.el.style.display = "flex";
      }
    }

    bringToFront() {
      highestZIndex += 1;
      this.el.style.zIndex = highestZIndex;
    }

    setContent(htmlOrNode) {
      if (typeof htmlOrNode === "string") {
        this.bodyEl.innerHTML = htmlOrNode;
      } else if (htmlOrNode instanceof HTMLElement) {
        this.bodyEl.innerHTML = "";
        this.bodyEl.appendChild(htmlOrNode);
      }
    }

    setTitle(text) {
      this.titleEl.textContent = text;
    }

    close() {
      if (this.hideOnClose) {
        this.setHidden(true);
        return;
      }
      if (this.el && this.el.parentNode) {
        this.el.parentNode.removeChild(this.el);
      }
    }
  }

  return {
    create: (options) => new WindowInstance(options)
  };

  window.WindowManager = this;
})();
</script>

<script>
// TinyTools (Integrated)
window.devtoolsWindow = WindowManager.create({
  title: `TinyTools (Integrated) - <a href="#" onclick="window.openTinyToolsAbout(); return false;">About</a>`,
  x: 90,
  y: 60,
  width: 820,
  height: 470,
  hidden: true,
  hideOnClose: true,
  content: `
    <div style="display:flex;flex-direction:column;height:100%;min-height:0;">
      <div id="loggerWindowElements" style="margin:0;padding:0;white-space:pre-line;flex:1;min-height:0;overflow:auto;user-select:text;"></div>
      <div style="display:flex;gap:6px;margin-top:8px;flex:none;">
        <input id="tinyConsoleInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter JavaScript (variables persist)" style="flex:1;min-width:0;padding:5px 8px;user-select:text;border:1px solid #b5b5b5;border-radius:4px;background:linear-gradient(to bottom, #d0d0d0 0%, #f4f4f4 100%);box-shadow:inset 0 1px 3px rgba(0,0,0,0.18);outline:none;" />
        <button type="button" id="tinyConsoleSend" style="padding:4px 14px;">Send</button>
      </div>
    </div>
  `

// TinyTools JS console: executes in the page's real global scope. Expressions
// are evaluated for their value; everything else is injected as a script so
// top-level var/let/const/function/class declarations persist between runs.
(function setupTinyToolsConsole() {
  const logEl = document.getElementById('loggerWindowElements');
  const input = document.getElementById('tinyConsoleInput');
  const sendBtn = document.getElementById('tinyConsoleSend');
  if (!logEl || !input) return;

  const history = [];
  let historyIndex = 0;
  let scriptRun = 0;

  function appendLog(text, color, weight) {
    const line = document.createElement('div');
    line.textContent = text;
    line.style.padding = '2px 0';
    line.style.borderBottom = '1px solid lightgrey';
    if (color) line.style.color = color;
    if (weight) line.style.fontWeight = weight;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function formatValue(value, depth, seen) {
    depth = depth || 0;
    if (typeof value === 'string') return JSON.stringify(value);
    if (typeof value === 'undefined') return 'undefined';
    if (typeof value === 'function') return value.toString();
    if (value === null) return 'null';
    if (typeof value !== 'object') return String(value);

    if (value === window) return '[object Window]';
    if (value instanceof Error) return formatError(value);
    if (value instanceof RegExp) return String(value);
    if (value instanceof Node) {
      if (value instanceof Element) return value.outerHTML.slice(0, 4000);
      return String(value);
    }
    if (value instanceof Date) {
      try { return value.toISOString(); } catch (e) { return String(value); }
    }

    const tag = Object.prototype.toString.call(value);
    if (tag === '[object Map]') return 'Map(' + value.size + ')';
    if (tag === '[object Set]') return 'Set(' + value.size + ')';

    const isArray = Array.isArray(value);
    let isPlain = false;
    try {
      const proto = Object.getPrototypeOf(value);
      isPlain = proto === Object.prototype || proto === null;
    } catch (e) {}

    // Never walk into host objects or class instances: that can touch huge
    // getter graphs (window, document, app, ...) and freeze the page.
    if (!isArray && !isPlain) {
      const ctor = value.constructor && value.constructor.name;
      return '[object ' + (ctor || 'Object') + ']';
    }

    if (depth >= 2) return isArray ? '[Array]' : '{…}';

    seen = seen || new WeakSet();
    if (seen.has(value)) return '[Circular]';
    seen.add(value);

    const indent = '  '.repeat(depth + 1);
    const closing = '  '.repeat(depth);

    if (isArray) {
      const items = value.slice(0, 50).map(item => formatValue(item, depth + 1, seen));
      if (value.length > 50) items.push('… ' + (value.length - 50) + ' more');
      return '[\n' + indent + items.join(',\n' + indent) + '\n' + closing + ']';
    }

    const keys = Object.keys(value);
    if (keys.length === 0) return '{}';
    const entries = keys.slice(0, 50).map(key => {
      let formatted;
      try {
        formatted = formatValue(value[key], depth + 1, seen);
      } catch (e) {
        formatted = '[Thrown: ' + (e && e.message ? e.message : e) + ']';
      }
      return JSON.stringify(key) + ': ' + formatted;
    });
    if (keys.length > 50) entries.push('… ' + (keys.length - 50) + ' more');
    return '{\n' + indent + entries.join(',\n' + indent) + '\n' + closing + '}';
  }

  function appendResult(value) {
    if (value && typeof value.then === 'function') {
      appendLog('Promise { <pending> }', '#888');
      value.then(
        resolved => appendLog('Promise resolved: ' + formatValue(resolved), '#1f6f3f'),
        rejected => appendLog('Promise rejected: ' + formatValue(rejected), '#b00020')
      );
      return;
    }
    appendLog(formatValue(value));
  }

  function formatError(err) {
    if (!err) return 'Error';
    const header = (err.name || 'Error') + ': ' + (err.message || String(err));
    if (typeof err.stack !== 'string') return header;
    const frames = err.stack.split('\n').filter(line => {
      if (!/^\s*at /.test(line)) return false;
      // Hide the console harness frames; keep frames from the user's code.
      return !/at eval \(eval at /.test(line) &&
        !/at (?:execute|submit|runAsScript|setupTinyToolsConsole) \(.*\.html/.test(line) &&
        !/at HTMLInputElement\./.test(line);
    });
    return [header, ...frames].join('\n');
  }

  function appendError(err) {
    appendLog(formatError(err), '#b00020');
  }

  function runAsScript(code, deferErrors) {
    let error = null;
    const onError = event => {
      error = event.error || new Error(event.message);
    };
    window.addEventListener('error', onError, true);
    try {
      const script = document.createElement('script');
      script.textContent = code + '\n//# sourceURL=ttc' + (++scriptRun) + '.js';
      (document.head || document.documentElement).appendChild(script);
      script.remove();
    } catch (err) {
      error = err;
    } finally {
      window.removeEventListener('error', onError, true);
    }
    if (error && !deferErrors) appendError(error);
    return error;
  }

  function execute(code) {
    if (!code || !code.trim()) return;
    appendLog(code, '#1f6f3f', '700');

    // Don't evaluate function/class/variable declarations as expressions:
    // that would create throwaway expressions instead of persistent globals.
    const withoutLeadingComments = code.replace(/^(?:\s|\/\/[^\n]*\n|\/\*[\s\S]*?\*\/)*/, '');
    const isDeclaration = /^(?:var|let|const|function|class|async\s+function|import|export)\b/.test(withoutLeadingComments);
    const isStatement = /^(?:if|for|while|do|switch|try|throw|return|break|continue|debugger|with)\b|^\{/.test(withoutLeadingComments);

    if (isDeclaration || isStatement) {
      runAsScript(code);
      return;
    }

    // Evaluate as a single expression via a real script (not eval) so error
    // stacks point at the console source instead of the host HTML.
    const expression = code.replace(/;\s*$/, '');
    const resultKey = '__tinytoolsConsoleResult' + (++scriptRun);
    const wrapped = 'window[' + JSON.stringify(resultKey) + '] = (\n' + expression + '\n);';
    const error = runAsScript(wrapped, true);

    if (!error) {
      const value = window[resultKey];
      try { delete window[resultKey]; } catch (e) {}
      appendResult(value);
    } else if (error.name === 'SyntaxError' || /SyntaxError/.test(error.message || '')) {
      // Not a single expression — run the whole thing as statements.
      runAsScript(code);
    } else {
      appendError(error);
    }
  }

  function submit() {
    const code = input.value;
    if (!code.trim()) return;
    history.push(code);
    historyIndex = history.length;
    input.value = '';
    execute(code);
  }

  if (sendBtn) {
    sendBtn.addEventListener('click', () => {
      submit();
      input.focus();
    });
  }

  input.addEventListener('keydown', event => {
    // Let the global Ctrl+` shortcut through so the window can be toggled.
    if (event.ctrlKey && event.key === '`') return;
    event.stopPropagation();
    if (event.key === 'Enter') {
      event.preventDefault();
      submit();
    } else if (event.key === 'ArrowUp') {
      event.preventDefault();
      if (historyIndex > 0) {
        historyIndex -= 1;
        input.value = history[historyIndex];
      }
    } else if (event.key === 'ArrowDown') {
      event.preventDefault();
      if (historyIndex < history.length - 1) {
        historyIndex += 1;
        input.value = history[historyIndex];
      } else {
        historyIndex = history.length;
        input.value = '';
      }
    }
  });
  input.addEventListener('keyup', event => {
    if (!(event.ctrlKey && event.key === '`')) event.stopPropagation();
  });
  input.addEventListener('keypress', event => {
    if (!(event.ctrlKey && event.key === '`')) event.stopPropagation();
  });

  window.tinyToolsConsole = {
    run: execute,
    focus: () => input.focus()
  };
})();

// New Update prompt for standalone file:// builds. Connects to the data-store
// websocket, which expects a plain filename and replies with a JSON object:
// { path, contentType, encoding, content }.
(function setupFileUpdateCheck() {
  if (window.location.protocol !== 'file:') return;

  const DATASTORE_URL = 'wss://datastore.breakmine.com';
  const REQUEST_TIMEOUT_MS = 15000;

  function stripGitHash(version) {
    return String(version || '').trim().replace(/-[0-9a-f]{7,40}$/i, '');
  }

  function versionParts(version) {
    return stripGitHash(version).split('.').map(part => {
      const match = part.match(/^(\d+)([a-z]*)$/i);
      return match
        ? { number: parseInt(match[1], 10), suffix: match[2].toLowerCase() }
        : { number: 0, suffix: part.toLowerCase() };
    });
  }

  function isNewerVersion(latest, current) {
    const a = versionParts(latest);
    const b = versionParts(current);
    const length = Math.max(a.length, b.length);
    for (let i = 0; i < length; i++) {
      const left = a[i] || { number: 0, suffix: '' };
      const right = b[i] || { number: 0, suffix: '' };
      if (left.number !== right.number) return left.number > right.number;
      if (left.suffix !== right.suffix) return left.suffix > right.suffix;
    }
    return false;
  }

  function datastoreRequest(fileName, timeoutMs) {
    return new Promise((resolve, reject) => {
      let ws;
      try {
        ws = new WebSocket(DATASTORE_URL);
      } catch (err) {
        reject(err);
        return;
      }

      let settled = false;
      const finish = (err, payload) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        try { ws.close(); } catch (e) {}
        if (err) reject(err); else resolve(payload);
      };

      const timer = setTimeout(
        () => finish(new Error('Timed out waiting for ' + fileName)),
        timeoutMs || REQUEST_TIMEOUT_MS
      );

      // The server parses JSON, but falls back to treating the raw message as
      // a path — so the filename is sent on its own, exactly as it expects.
      ws.onopen = () => ws.send(fileName);
      ws.onmessage = event => {
        let payload;
        try {
          payload = JSON.parse(event.data);
        } catch (err) {
          finish(new Error('Invalid response from data store'));
          return;
        }
        if (payload.error) {
          finish(new Error(payload.error));
          return;
        }
        if (typeof payload.content !== 'string') {
          finish(new Error('Response from data store has no content'));
          return;
        }
        finish(null, payload);
      };
      ws.onerror = () => finish(new Error('Could not connect to data store'));
      ws.onclose = () => finish(new Error('Data store connection closed'));
    });
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function showUpdateWindow(current, latest) {
    const win = WindowManager.create({
      title: 'New Update',
      x: 560,
      y: 100,
      width: 400,
      height: 215,
      resizeable: false,
      noOverflow: true,
      content: `
        <div style="display:flex;flex-direction:column;height:100%;">
          <p style="margin:0;">
            A new version of Breakmine is available.<br><br>
            <b>Current:</b> ${escapeHtml(stripGitHash(current))}<br>
            <b>New:</b> ${escapeHtml(latest)}
          </p>
          <p id="updateStatus" style="margin:8px 0 0;color:#666;min-height:1.2em;"></p>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:auto;padding-top:10px;">
            <button type="button" id="updateLater">Later</button>
            <button type="button" id="updateDownload">Download</button>
          </div>
        </div>`
    });

    const status = document.getElementById('updateStatus');
    const downloadButton = document.getElementById('updateDownload');

    document.getElementById('updateLater').addEventListener('click', () => win.close());
    downloadButton.addEventListener('click', async () => {
      downloadButton.disabled = true;
      status.textContent = 'Downloading new version...';
      try {
        const file = await datastoreRequest('index.html', 120000);
        let blob;
        if (file.encoding === 'base64') {
          const bytes = Uint8Array.from(atob(file.content), ch => ch.charCodeAt(0));
          blob = new Blob([bytes], { type: file.contentType || 'text/html' });
        } else {
          blob = new Blob([file.content], { type: file.contentType || 'text/html' });
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = file.path ? file.path.split('/').pop() : 'index.html';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);

        status.textContent = 'Downloaded. Replace your current index.html with the new one.';
        downloadButton.textContent = 'Download again';
        downloadButton.disabled = false;
      } catch (err) {
        status.textContent = 'Download failed: ' + ((err && err.message) || err);
        downloadButton.disabled = false;
      }
    });
  }

  function checkForUpdate() {
    const current = window.GAME_VERSION;
    if (!current) return;

    datastoreRequest('version.txt').then(file => {
      const latest = String(file.content || '').trim();
      if (latest && isNewerVersion(latest, current)) {
        showUpdateWindow(current, latest);
      }
    }).catch(err => {
      console.warn('[update] check failed:', (err && err.message) || err);
    });
  }

  if (document.readyState === 'complete') {
    checkForUpdate();
  } else {
    window.addEventListener('load', checkForUpdate, { once: true });
  }
})();

<script>
    /**
 * Controller (DualShock 4 / DualSense / Xbox 360 / Switch Pro) Mouse & Keyboard Browser Polyfill
 * 
* Features:
 * - Creates a fixed overlay canvas for a smooth visual mouse cursor.
 * - Reads window.GAMESTATE to know what the game is doing and switches the
 *   whole mapping between "in game" and "in a menu".
 *
 *   In game : X = jump, left stick = move, right stick = look,
 *             Square = inventory (closes it again), Circle = pause,
 *             L3 = shift (sneak), L2 = place, R2 = break,
 *             L1/R1 = prev/next hotbar slot.
 *   Menus  : X = left click, Square = right click, Triangle = on-screen
 *             keyboard, Circle = escape, left stick = mouse, triggers scroll.
 *
 * - Dispatches real-like DOM events (mousemove, mousedown, mouseup, click, keydown, keyup).
 */
(function () {
  'use strict';

  // --- Configuration & Settings ---
  const config = {
    cursorSpeed: 12,           // Speed multiplier for cursor/look movement
    deadzone: 0.15,            // Analog stick deadzone to prevent drift
    triggerThreshold: 0.5,    // Analog trigger value counted as pressed
    scrollRepeatMs: 150,      // Repeat delay while a trigger is held (menus)
    cursorSize: 18,            // Size of the visual cursor SVG/pointer
    cursorColor: '#10b981'     // Cursor highlight color
  };

  // --- State Variables ---
  let cursorX = window.innerWidth / 2;
  let cursorY = window.innerHeight / 2;
  let canvas, ctx;
  let hoveredElement = null;
  const activeKeys = new Set();
  const previousButtonStates = {};

  // --- Game state (window.GAMESTATE, published every frame by Minecraft.js) ---
  let lookMode = false;

  // Movement/sneak keys currently held down by the gamepad.
  const heldGameKeys = new Set();

  // Mouse buttons currently held down by the gamepad (triggers in game).
  const heldMouseButtons = new Map();

  // Square is the inventory button, so it closes the container when open.
  let squareClosedScreen = false;
  const CONTAINER_SCREENS = [
    'GuiPlayerInventory',
    'GuiContainerCreative',
    'GuiContainerChest',
    'GuiContainerFurnace',
    'GuiContainerCraftingTable'
  ];

  function isContainerScreen() {
    const screen = window.app && window.app.currentScreen;
    return !!screen && CONTAINER_SCREENS.indexOf(screen.constructor.name) !== -1;
  }

  // TV mode moves with the arrow keys, desktop mode with WASD.
  function movementKeys() {
    const tvmode = !!(window.app && window.app.settings && window.app.settings.tvmode);
    return tvmode
      ? {
        forward: { key: 'ArrowUp', code: 'ArrowUp' },
        back: { key: 'ArrowDown', code: 'ArrowDown' },
        left: { key: 'ArrowLeft', code: 'ArrowLeft' },
        right: { key: 'ArrowRight', code: 'ArrowRight' }
      }
      : {
        forward: { key: 'w', code: 'KeyW' },
        back: { key: 's', code: 'KeyS' },
        left: { key: 'a', code: 'KeyA' },
        right: { key: 'd', code: 'KeyD' }
      };
  }

  // L3 = shift, which the game binds to sneaking (default ShiftLeft).
  function crouchMapping() {
    const app = window.app;
    const code = (app && app.settings && app.settings.keyCrouching) || 'ShiftLeft';
    return { code, key: code.replace(/Left$|Right$/, '') };
  }

  // Hold/release a game key without spamming keydown/keyup every frame.
  function setGameKey(mapping, held) {
    if (held) {
      if (!heldGameKeys.has(mapping.code)) {
        heldGameKeys.add(mapping.code);
        dispatchKeyEvent('keydown', mapping);
      }
    } else if (heldGameKeys.has(mapping.code)) {
      heldGameKeys.delete(mapping.code);
      dispatchKeyEvent('keyup', mapping);
    }
  }

  function releaseGameKeys() {
    for (const code of Array.from(heldGameKeys)) {
      heldGameKeys.delete(code);
      dispatchKeyEvent('keyup', { code, key: code.replace(/^(Key|Digit|Arrow)/, '') });
    }
  }

  // Same as setGameKey but for buttons that must be held (place / break).
  function setMouseButton(button, held, x, y) {
    if (held) {
      if (!heldMouseButtons.has(button)) {
        heldMouseButtons.set(button, { x, y });
        dispatchMouseEvent('mousedown', button, x, y);
      }
    } else if (heldMouseButtons.has(button)) {
      const pos = heldMouseButtons.get(button);
      heldMouseButtons.delete(button);
      dispatchMouseEvent('mouseup', button, pos.x, pos.y);
    }
  }

  // Press/release a mouse button for a single tap (menus).
  function tapMouseButton(button, pressed, x, y) {
    if (pressed) {
      dispatchMouseEvent('mousedown', button, x, y);
    } else {
      dispatchMouseEvent('mouseup', button, x, y);
      dispatchMouseEvent(button === 2 ? 'contextmenu' : 'click', button, x, y);
    }
  }

  function releaseMouseButtons() {
    for (const [button, pos] of heldMouseButtons) {
      dispatchMouseEvent('mouseup', button, pos.x, pos.y);
    }
    heldMouseButtons.clear();
  }

  // Let go of everything when the game switches between playing and a menu.
  function releaseHeldInputs() {
    releaseGameKeys();
    releaseMouseButtons();
  }

  // Fire once on press, then repeat while held (menu list scrolling).
  const repeatTimers = new Map();
  function repeatAction(key, active, action, intervalMs) {
    let timer = repeatTimers.get(key);
    if (!active) {
      if (timer) {
        clearInterval(timer);
        repeatTimers.delete(key);
      }
      return;
    }
    if (timer) return;
    action();
    timer = setInterval(action, intervalMs);
    repeatTimers.set(key, timer);
  }

  // --- Virtual keyboard (Triangle in menus) ---
  // A real on-screen keyboard: a small DOM panel whose buttons are also hit by
  // the polyfill's own cursor, so it works with a gamepad on any platform (no
  // platform/mobile keyboard needed). Keys are fed straight into the focused
  // text widget through its own keyTyped().
  const VK_LAYOUT = [
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'],
    ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
    ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'],
    [{ label: 'Shift', wide: true, action: 'shift' },
     'z', 'x', 'c', 'v', 'b', 'n', 'm',
     { label: '\u232b', wide: true, action: 'back' }],
    [{ label: '\u2190', action: 'left' },
     { label: '\u2192', action: 'right' },
     { label: 'space', wide: true, action: 'space' },
     { label: '\u23ce', action: 'enter' },
     { label: '?123', action: 'layout' },
     { label: '\u2715', action: 'close' }]
  ];

  // Symbols live on their own page, toggled with ?123 / ABC.
  const VK_SYMBOL_LAYOUT = [
    ['.', ',', ';', ':', '?', '!'],
    ['-', '+', '_', '=', '*', '/', '\\', '|'],
    ['(', ')', '[', ']', '{', '}', '<', '>'],
    ['@', '#', '$', '%', '^', '&', '~', '`'],
    [{ label: 'ABC', wide: true, action: 'layout' },
     { label: '\u232b', wide: true, action: 'back' },
     { label: '\u2190', action: 'left' },
     { label: '\u2192', action: 'right' },
     { label: 'space', wide: true, action: 'space' },
     { label: '\u23ce', action: 'enter' },
     { label: '\u2715', action: 'close' }]
  ];

  let vkRoot = null;
  let vkBody = null;
  let vkWidget = null;
  let vkShift = false;
  let vkSymbols = false;
  let vkScreen = null;

  function focusedTextWidget() {
    const screen = window.app && window.app.currentScreen;
    if (!screen) return null;

    const isTextWidget = w => w && typeof w.setText === 'function' && typeof w.getText === 'function'
      && typeof w.keyTyped === 'function';

    if (screen.buttonList) {
      for (const button of screen.buttonList) {
        if (isTextWidget(button) && button.isFocused === true) {
          return button;
        }
      }
    }

    // Chat and friends expose their field directly, even when unfocused
    return isTextWidget(screen.inputField) ? screen.inputField : null;
  }

  function vkKeyStyle() {
    return 'flex:1 1 0;background:#2f2f33;color:#fff;border:1px solid #55565c;border-radius:5px;' +
      'font-family:inherit;font-size:15px;line-height:1;height:30px;' +
      'text-align:center;min-width:30px;cursor:pointer;user-select:none;touch-action:none;';
  }

  function vkPressKey(character, code) {
    if (vkWidget === null) return;

    // Text fields insert on a single character and only inspect the code for
    // Backspace / arrows / ctrl combos, so send exactly what a keyboard sends.
    vkWidget.keyTyped(code || character, character);
    vkShift = false;
    updateVirtualKeyboardLabels();
  }

  function vkPressAction(action) {
    switch (action) {
      case 'shift':
        vkShift = !vkShift;
        updateVirtualKeyboardLabels();
        break;
      case 'layout':
        vkSymbols = !vkSymbols;
        vkShift = false;
        renderVirtualKeyboard();
        break;
      case 'back':
        vkPressKey('Backspace', 'Backspace');
        break;
      case 'left':
        vkPressKey('ArrowLeft', 'ArrowLeft');
        break;
      case 'right':
        vkPressKey('ArrowRight', 'ArrowRight');
        break;
      case 'space':
        vkPressKey(' ', 'Space');
        break;
      case 'enter':
        // Send it as a real Enter so the game routes it exactly like a
        // keyboard (chat sends the message, fields confirm, ...).
        dispatchKeyEvent('keydown', ENTER_KEY);
        dispatchKeyEvent('keyup', ENTER_KEY);
        closeVirtualKeyboard();
        break;
      case 'close':
        closeVirtualKeyboard();
        break;
    }
  }

  function updateVirtualKeyboardLabels() {
    if (!vkRoot) return;

    const shiftBtn = vkRoot.querySelector('.vk-shift');
    if (shiftBtn) {
      shiftBtn.textContent = vkShift ? 'SHIFT' : 'Shift';
      shiftBtn.style.background = vkShift ? config.cursorColor : '#2f2f33';
      shiftBtn.style.color = vkShift ? '#06281c' : '#fff';
    }

    for (const btn of vkRoot.querySelectorAll('[data-char]')) {
      const c = btn.getAttribute('data-char');
      btn.textContent = vkShift ? c.toUpperCase() : c;
    }
  }

  // Draggable floating window, position remembered between openings.
  let vkDrag = null;

  function startKeyboardDrag(event) {
    if (vkDrag) return;

    const rect = vkRoot.getBoundingClientRect();
    vkDrag = { startX: event.clientX, startY: event.clientY, left: rect.left, top: rect.top };

    // Capture phase: the panel stops bubbling mouse events so they never reach
    // the game, which means the drag has to listen before that happens.
    window.addEventListener('mousemove', onKeyboardDragMove, true);
    window.addEventListener('mouseup', endKeyboardDrag, true);
  }

  function onKeyboardDragMove(event) {
    if (!vkDrag || !vkRoot) return;

    const width = vkRoot.offsetWidth;
    const height = vkRoot.offsetHeight;
    const left = vkDrag.left + (event.clientX - vkDrag.startX);
    const top = vkDrag.top + (event.clientY - vkDrag.startY);

    vkRoot.style.left = Math.max(0, Math.min(window.innerWidth - width, left)) + 'px';
    vkRoot.style.top = Math.max(0, Math.min(window.innerHeight - height, top)) + 'px';
  }

  function endKeyboardDrag() {
    vkDrag = null;
    window.removeEventListener('mousemove', onKeyboardDragMove, true);
    window.removeEventListener('mouseup', endKeyboardDrag, true);

    if (vkRoot) {
      try {
        localStorage.setItem('ps4_vk_pos', vkRoot.style.left + '|' + vkRoot.style.top);
      } catch (e) { /* storage unavailable */ }
    }
  }

  function placeVirtualKeyboard() {
    if (!vkRoot) return;

    const width = vkRoot.offsetWidth;
    const height = vkRoot.offsetHeight;

    let left = null;
    let top = null;
    try {
      const saved = localStorage.getItem('ps4_vk_pos');
      if (saved) {
        const parts = saved.split('|');
        left = parseFloat(parts[0]);
        top = parseFloat(parts[1]);
      }
    } catch (e) { /* storage unavailable */ }

    if (left === null || top === null || isNaN(left) || isNaN(top)) {
      left = (window.innerWidth - width) / 2;
      top = window.innerHeight - height - 8;
    }

    // Keep it fully on screen after a resize
    vkRoot.style.left = Math.max(0, Math.min(window.innerWidth - width, left)) + 'px';
    vkRoot.style.top = Math.max(0, Math.min(window.innerHeight - height, top)) + 'px';
  }

  function buildVirtualKeyboard() {
    if (vkRoot) return vkRoot;

    vkRoot = document.createElement('div');
    vkRoot.id = 'ps4-virtual-keyboard';
    vkRoot.style.cssText = 'position:fixed;display:none;flex-direction:column;z-index:999998;' +
      'background:rgba(12,12,14,0.94);border:1px solid #3a3b40;border-radius:10px;' +
      'box-shadow:0 8px 30px rgba(0,0,0,0.6);width:420px;max-width:92vw;';

    // Keys handle their own clicks; keep them from reaching the game screen
    // (it listens on document and would otherwise click widgets behind us).
    for (const type of ['mousedown', 'mouseup', 'click', 'dblclick', 'contextmenu', 'wheel', 'touchstart']) {
      vkRoot.addEventListener(type, event => event.stopPropagation());
    }

    // Title bar doubles as the drag handle
    const title = document.createElement('div');
    title.style.cssText = 'display:flex;align-items:center;justify-content:space-between;' +
      'padding:5px 8px;background:#22232a;border-bottom:1px solid #3a3b40;' +
      'border-radius:9px 9px 0 0;cursor:move;user-select:none;touch-action:none;';
    title.addEventListener('mousedown', startKeyboardDrag);

    const label = document.createElement('span');
    label.textContent = 'Keyboard';
    label.style.cssText = 'color:#c9cbd1;font-size:13px;';

    const close = document.createElement('div');
    close.textContent = '\u2715';
    close.style.cssText = 'color:#c9cbd1;font-size:13px;padding:0 6px;cursor:pointer;';
    close.addEventListener('click', () => closeVirtualKeyboard());

    title.appendChild(label);
    title.appendChild(close);

    vkBody = document.createElement('div');
    vkBody.style.cssText = 'display:flex;flex-direction:column;gap:4px;padding:6px;';

    vkRoot.appendChild(title);
    vkRoot.appendChild(vkBody);
    document.body.appendChild(vkRoot);
    renderVirtualKeyboard();
    return vkRoot;
  }

  // (Re)build the key rows for the current page (letters or symbols).
  function renderVirtualKeyboard() {
    if (!vkBody) return;

    vkBody.textContent = '';

    for (const row of (vkSymbols ? VK_SYMBOL_LAYOUT : VK_LAYOUT)) {
      const rowEl = document.createElement('div');
      rowEl.style.cssText = 'display:flex;gap:4px;width:100%;';

      for (const entry of row) {
        const btn = document.createElement('div');
        btn.style.cssText = vkKeyStyle();

        if (typeof entry === 'string') {
          btn.setAttribute('data-char', entry);
          btn.textContent = entry;
          btn.addEventListener('click', () => {
            const c = btn.getAttribute('data-char');
            const out = vkShift ? c.toUpperCase() : c;
            if (/^[a-z0-9]$/.test(c)) {
              vkPressKey(out, (/^[0-9]$/.test(c) ? 'Digit' : 'Key') + out.toUpperCase());
            } else {
              // Symbols are plain characters; the widget only reads the char.
              vkPressKey(out, out);
            }
          });
        } else {
          if (entry.wide) btn.style.flex = '2 1 0';
          if (entry.action === 'shift') btn.className = 'vk-shift';
          btn.textContent = entry.label;
          btn.addEventListener('click', () => vkPressAction(entry.action));
        }

        rowEl.appendChild(btn);
      }

      vkBody.appendChild(rowEl);
    }

    updateVirtualKeyboardLabels();
  }

  function openVirtualKeyboard() {
    const app = window.app;
    const widget = focusedTextWidget();
    if (!app || !widget) return;

    vkWidget = widget;
    vkScreen = app.currentScreen;
    vkShift = false;

    // Keep the field focused while the panel is up: the game would otherwise
    // drop focus as soon as the cursor moves onto the keyboard.
    widget.isFocused = true;
    if (typeof widget.enableS === 'boolean') widget.enableS = false;

    buildVirtualKeyboard().style.display = 'flex';
    placeVirtualKeyboard();
    updateVirtualKeyboardLabels();
  }

  function closeVirtualKeyboard() {
    endKeyboardDrag();

    if (!vkRoot) {
      vkWidget = null;
      return;
    }

    vkRoot.style.display = 'none';

    const widget = vkWidget;
    if (widget) {
      if (typeof widget.enableS === 'boolean') widget.enableS = true;
      widget.isFocused = false;
    }

    vkWidget = null;
    vkScreen = null;
  }

  // Close the panel when the screen it was opened for is gone.
  function syncVirtualKeyboard() {
    if (!vkWidget) return;

    const screen = window.app && window.app.currentScreen;
    if (screen !== vkScreen || focusedTextWidget() === null) {
      closeVirtualKeyboard();
    }
  }

  function gameState() {
    return window.GAMESTATE || null;
  }

  // True when the player is actually driving the camera: in game, no screen
  // open and the game considers itself focused (pointer lock, or TV mode).
  function isLookMode() {
    const gs = gameState();
    if (!gs) return false;
    return gs.inGame === true && gs.guiOpen === false && gs.hasFocus === true;
  }

  // --- PS4 Standard Gamepad Button Index Mapping ---
  const PS4_BUTTONS = {
    CROSS: 0,          // X
    CIRCLE: 1,         // O
    SQUARE: 2,         // Square
    TRIANGLE: 3,       // Triangle
    L1: 4,             // Left shoulder
    R1: 5,             // Right shoulder
    L2: 6,             // Left analog trigger
    R2: 7,             // Right analog trigger
    SHARE: 8,          // Share / Create
    OPTIONS: 9,        // Options
    L3: 10,            // Left Stick Click
    R3: 11,            // Right Stick Click
    DPAD_UP: 12,       // Arrow Up
    DPAD_DOWN: 13,     // Arrow Down
    DPAD_LEFT: 14,     // Arrow Left
    DPAD_RIGHT: 15,    // Arrow Right
    PS_BUTTON: 16      // Meta / Home key
  };

  // Buttons that behave the same everywhere. The rest (X, Square, Circle,
  // Triangle, L1, R1) are mode dependent and handled in onButtonDown/Up:
  //   menus : X=left click, Square=right click, Triangle=virtual keyboard,
  //           Share=back, left stick=mouse
  //   in game: X=jump, Square=inventory, Triangle=unused, Options=pause menu,
  //           Share=back, left stick=move, right stick=look, L3=shift(sneak),
  //           L2=place, R2=break, L1/R1=prev/next hotbar slot
  // Circle is deliberately unmapped so it does nothing.
  const BUTTON_KEY_MAP = {
    [PS4_BUTTONS.OPTIONS]: { key: 'Enter', code: 'Enter' },
    [PS4_BUTTONS.DPAD_UP]: { key: 'ArrowUp', code: 'ArrowUp' },
    [PS4_BUTTONS.DPAD_DOWN]: { key: 'ArrowDown', code: 'ArrowDown' },
    [PS4_BUTTONS.DPAD_LEFT]: { key: 'ArrowLeft', code: 'ArrowLeft' },
    [PS4_BUTTONS.DPAD_RIGHT]: { key: 'ArrowRight', code: 'ArrowRight' }
  };

  const ESCAPE_KEY = { key: 'Escape', code: 'Escape' };
  const ENTER_KEY = { key: 'Enter', code: 'Enter' };
  const JUMP_KEY = { key: ' ', code: 'Space' };

  function inventoryKey() {
    const app = window.app;
    const code = (app && app.settings && app.settings.keyOpenInventory) || 'KeyE';
    return { code, key: code.replace(/^Key/, '') };
  }

  function chatKey() {
    const app = window.app;
    const code = (app && app.settings && app.settings.keyOpenChat) || 'KeyT';
    return { code, key: code.replace(/^Key/, '') };
  }

  // Cycle the selected hotbar slot through the game itself.
  function switchItem(delta) {
    const app = window.app;
    if (app && typeof app.onMouseScroll === 'function') {
      app.onMouseScroll(delta);
    }
  }

  // --- Setup Visual Overlay ---
  function initOverlay() {
    canvas = document.createElement('canvas');
    canvas.id = 'ps4-mouse-polyfill-overlay';
    canvas.style.position = 'fixed';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.width = '100vw';
    canvas.style.height = '100vh';
    canvas.style.pointerEvents = 'none';
    canvas.style.zIndex = '999999';
    
    ctx = canvas.getContext('2d');
    document.body.appendChild(canvas);

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  }

  function resizeCanvas() {
    if (!canvas) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  // Draw the custom mouse pointer (hidden while looking around in game)
  function renderCursor() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (lookMode) return;

    ctx.save();
    ctx.translate(cursorX, cursorY);

    // Draw Arrow Cursor
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, config.cursorSize);
    ctx.lineTo(config.cursorSize * 0.4, config.cursorSize * 0.7);
    ctx.lineTo(config.cursorSize * 0.7, config.cursorSize * 0.7);
    ctx.closePath();

    ctx.fillStyle = config.cursorColor;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    ctx.restore();
  }

  // Apply deadzone processing to analog stick values (-1.0 to 1.0)
  function applyDeadzone(value) {
    if (Math.abs(value) < config.deadzone) return 0;
    const sign = Math.sign(value);
    return sign * ((Math.abs(value) - config.deadzone) / (1 - config.deadzone));
  }

  // --- Synthetic DOM Event Dispatchers ---
  function dispatchMouseEvent(type, buttonNumber = 0, posX = cursorX, posY = cursorY) {
    const targetElement = document.elementFromPoint(posX, posY) || document.body;

    // Handle hover enter/leave state
    if (type === 'mousemove') {
      if (hoveredElement !== targetElement) {
        if (hoveredElement) {
          hoveredElement.dispatchEvent(new MouseEvent('mouseleave', { bubbles: false, clientX: posX, clientY: posY }));
          hoveredElement.dispatchEvent(new MouseEvent('mouseout', { bubbles: true, clientX: posX, clientY: posY }));
        }
        targetElement.dispatchEvent(new MouseEvent('mouseenter', { bubbles: false, clientX: posX, clientY: posY }));
        targetElement.dispatchEvent(new MouseEvent('mouseover', { bubbles: true, clientX: posX, clientY: posY }));
        hoveredElement = targetElement;
      }
    }

    const mouseEvt = new MouseEvent(type, {
      bubbles: true,
      cancelable: true,
      view: window,
      clientX: posX,
      clientY: posY,
      screenX: posX,
      screenY: posY,
      button: buttonNumber,
      buttons: type === 'mousedown' ? (buttonNumber === 0 ? 1 : buttonNumber === 2 ? 2 : 4) : 0
    });

    targetElement.dispatchEvent(mouseEvt);

    // Focus form elements on click
    if (type === 'click' && (targetElement.tagName === 'INPUT' || targetElement.tagName === 'TEXTAREA')) {
      targetElement.focus();
    }
  }

  // In-game look: synthetic mousemove events always carry movementX/movementY of
  // 0, so the camera never turned. Feed the game's own remote-look accumulator
  // instead - GameWindow applies settings.remoteSensitivity to it, so remotes
  // keep their own look speed instead of the mouse cursor's sensitivity.
  function dispatchLook(deltaX, deltaY) {
    const gw = window.app && window.app.window;
    if (!gw) return;
    if (typeof gw.addRemoteMotion === 'function') {
      gw.addRemoteMotion(deltaX, deltaY);
    } else {
      gw.mouseMotionX += deltaX;
      gw.mouseMotionY += -deltaY;
    }
  }

  // The game ignores world clicks (place / break / mine) until it considers
  // itself locked, which never happens on a TV because no pointer is ever
  // locked. Nudge it into the locked state ourselves.
  function requestGameFocus() {
    const gs = gameState();
    const gw = window.app && window.app.window;
    if (!gs || !lookMode || gs.focusLocked || !gw || !gw.focusState) return;

    const focusStateType = gw.focusState.constructor;
    const locked = typeof focusStateType.getById === 'function' ? focusStateType.getById(3) : null;
    if (locked && typeof gw.updateFocusState === 'function') {
      gw.updateFocusState(locked);
    }
  }

  // Circle / Options open the in-game pause menu. GameWindow ignores key
  // presses while it believes the mouse is outside the window, which is always
  // the case on a TV, so mark the window as focused before sending Escape.
  function dispatchPause() {
    const gw = window.app && window.app.window;
    if (gw) gw.mouseInsideWindow = true;
    dispatchKeyEvent('keydown', ESCAPE_KEY);
  }

  // Share is the universal "back" button: with a screen open it returns to the
  // previous screen, and in game (no screen) it falls through to the pause menu.
  function dispatchBack() {
    const gw = window.app && window.app.window;
    if (gw) gw.mouseInsideWindow = true;
    dispatchKeyEvent('keydown', ESCAPE_KEY);
  }

  function dispatchKeyEvent(type, mapping) {
    const activeElement = document.activeElement || document.body;
    const keyEvt = new KeyboardEvent(type, {
      bubbles: true,
      cancelable: true,
      key: mapping.key,
      code: mapping.code,
      view: window
    });

    activeElement.dispatchEvent(keyEvt);
  }

  function dispatchScrollEvent(deltaY) {
    const targetElement = document.elementFromPoint(cursorX, cursorY) || document.body;
    targetElement.scrollBy({ top: deltaY, behavior: 'smooth' });
  }

  // --- Mode dependent button handling ---
  function onButtonDown(index) {
    const x = lookMode ? window.innerWidth / 2 : cursorX;
    const y = lookMode ? window.innerHeight / 2 : cursorY;

    if (lookMode) {
      // --- In game ---
      // Circle is intentionally unmapped; Options opens the pause menu.
      switch (index) {
        case PS4_BUTTONS.SQUARE: dispatchKeyEvent('keydown', inventoryKey()); break;  // Inventory
        case PS4_BUTTONS.OPTIONS: dispatchPause(); break;                            // Pause menu (Options button)
        case PS4_BUTTONS.SHARE: dispatchBack(); break;                               // Back to previous screen
        case PS4_BUTTONS.L1: switchItem(-1); break;                                  // Prev item
        case PS4_BUTTONS.R1: switchItem(1); break;                                   // Next item
        case PS4_BUTTONS.DPAD_RIGHT: dispatchKeyEvent('keydown', chatKey()); break;  // Open chat
        default:
          // X (jump), L3 (sneak) and L2/R2 (place/break) are analog holds
          if (BUTTON_KEY_MAP[index]) dispatchKeyEvent('keydown', BUTTON_KEY_MAP[index]);
      }
      return;
    }

    // --- Menus ---
    switch (index) {
      case PS4_BUTTONS.CROSS: tapMouseButton(0, true, x, y); break;        // Left click
      case PS4_BUTTONS.L3: tapMouseButton(0, true, x, y); break;            // Left click
      case PS4_BUTTONS.R3: tapMouseButton(2, true, x, y); break;            // Right click
      case PS4_BUTTONS.TRIANGLE: openVirtualKeyboard(); break;             // Virtual keyboard
      case PS4_BUTTONS.SHARE: dispatchBack(); break;                       // Back to previous screen
      case PS4_BUTTONS.SQUARE:
        // Square is the inventory button: close the container instead of right clicking
        if (isContainerScreen()) {
          squareClosedScreen = true;
          dispatchKeyEvent('keydown', ESCAPE_KEY);
        } else {
          squareClosedScreen = false;
          tapMouseButton(2, true, x, y);
        }
        break;
      default:
        if (BUTTON_KEY_MAP[index]) dispatchKeyEvent('keydown', BUTTON_KEY_MAP[index]);
    }
  }

  function onButtonUp(index) {
    const x = lookMode ? window.innerWidth / 2 : cursorX;
    const y = lookMode ? window.innerHeight / 2 : cursorY;

    if (lookMode) {
      if (index === PS4_BUTTONS.SQUARE) {
        dispatchKeyEvent('keyup', inventoryKey());
      } else if (index === PS4_BUTTONS.OPTIONS || index === PS4_BUTTONS.SHARE) {
        dispatchKeyEvent('keyup', ESCAPE_KEY);
      } else if (index === PS4_BUTTONS.DPAD_RIGHT) {
        dispatchKeyEvent('keyup', chatKey());
      } else if (BUTTON_KEY_MAP[index]) {
        dispatchKeyEvent('keyup', BUTTON_KEY_MAP[index]);
      }
      return;
    }

    if (index === PS4_BUTTONS.SHARE) {
      dispatchKeyEvent('keyup', ESCAPE_KEY);
      closeVirtualKeyboard();
    } else if (index === PS4_BUTTONS.SQUARE && squareClosedScreen) {
      squareClosedScreen = false;
      dispatchKeyEvent('keyup', ESCAPE_KEY);
    } else if (index === PS4_BUTTONS.CROSS || index === PS4_BUTTONS.L3) {
      tapMouseButton(0, false, x, y);
    } else if (index === PS4_BUTTONS.SQUARE || index === PS4_BUTTONS.R3) {
      tapMouseButton(2, false, x, y);
    } else if (BUTTON_KEY_MAP[index]) {
      dispatchKeyEvent('keyup', BUTTON_KEY_MAP[index]);
    }
  }

  // --- Controller detection ---
  // The button layout below is identical on every pad we support, they only
  // differ in the name they report:
  //   DualShock 4 / DualSense : X O / Square Triangle / L1 R1 / L2 R2 / L3 R3
  //   Xbox 360                 : A B / X Y     / LB RB / LT RT / L3 R3
  //   Switch Pro               : A B / X Y     / L R  / ZL ZR / L3 R3
  // Buttons 0-3 are the four face buttons, 4/5 the shoulders, 6/7 the
  // triggers, 8/9 back+start and 10/11 the stick clicks - so the indices in
  // PS4_BUTTONS below are used as-is for all of them.
  const GAMEPAD_IDS = [
    'wireless controller',  // DualShock 4 / DualSense
    'dualshock',
    'dualsense',
    'playstation',
    'ps4 controller',
    'ps5 controller',
    'xbox 360',
    'xbox one',
    'xbox series',
    'xbox wireless',
    'xbox',                 // Generic "Xbox Controller" / "X-Box 360 pad"
    'pro controller',       // Switch Pro
    'nintendo switch',
    'joy-con'
  ];

  function findGamepad() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];

    for (const gp of gamepads) {
      if (!gp || !gp.id) continue;

      const id = gp.id.toLowerCase();
      for (const name of GAMEPAD_IDS) {
        if (id.includes(name)) return gp;
      }

      // Anything else that exposes the standard mapping has the same layout
      if (gp.mapping === 'standard') return gp;
    }

    return null;
  }

  // --- Main Gamepad Loop ---
  function pollGamepad() {
    const gamepad = findGamepad();

    if (gamepad) {
      // Follow the game: gamepad drives the player in game, the cursor in menus
      const look = isLookMode();
      if (look !== lookMode) {
        lookMode = look;
        releaseHeldInputs();
      }

      requestGameFocus();

      const leftX = applyDeadzone(gamepad.axes[0]);
      const leftY = applyDeadzone(gamepad.axes[1]);
      const rightX = applyDeadzone(gamepad.axes[2]);
      const rightY = applyDeadzone(gamepad.axes[3]);

      const held = index => {
        const b = gamepad.buttons[index];
        return !!(b && (b.pressed || b.value > config.triggerThreshold));
      };

      if (lookMode) {
        const clickX = window.innerWidth / 2;
        const clickY = window.innerHeight / 2;

        // 1. X = jump (hold)
        setGameKey(JUMP_KEY, held(PS4_BUTTONS.CROSS));

        // 2. Left stick = walk, L3 = shift (sneak)
        const keys = movementKeys();
        setGameKey(keys.forward, leftY < -config.deadzone);
        setGameKey(keys.back, leftY > config.deadzone);
        setGameKey(keys.left, leftX < -config.deadzone);
        setGameKey(keys.right, leftX > config.deadzone);
        setGameKey(crouchMapping(), held(PS4_BUTTONS.L3));

        // 3. Right stick = look around
        if (rightX !== 0 || rightY !== 0) {
          dispatchLook(rightX * config.cursorSpeed, rightY * config.cursorSpeed);
        }

        // 4. L2 = place (right click), R2 = break (left click)
        setMouseButton(2, held(PS4_BUTTONS.L2), clickX, clickY);
        setMouseButton(0, held(PS4_BUTTONS.R2), clickX, clickY);
      } else {
        // 1. Left stick = mouse cursor
        if (leftX !== 0 || leftY !== 0) {
          cursorX = Math.min(Math.max(0, cursorX + leftX * config.cursorSpeed), window.innerWidth);
          cursorY = Math.min(Math.max(0, cursorY + leftY * config.cursorSpeed), window.innerHeight);

          dispatchMouseEvent('mousemove');
        }

        // 2. Triggers scroll long lists
        repeatAction('l2', held(PS4_BUTTONS.L2), () => dispatchScrollEvent(-40), config.scrollRepeatMs);
        repeatAction('r2', held(PS4_BUTTONS.R2), () => dispatchScrollEvent(40), config.scrollRepeatMs);

        // 3. The virtual keyboard belongs to the screen it was opened from
        syncVirtualKeyboard();
      }

      // 3. Process Buttons (Clicks & Key Presses)
      gamepad.buttons.forEach((button, index) => {
        const isPressed = button.pressed;
        const wasPressed = previousButtonStates[index] || false;

        if (isPressed && !wasPressed) {
          onButtonDown(index);
        } else if (!isPressed && wasPressed) {
          onButtonUp(index);
        }

        previousButtonStates[index] = isPressed;
      });

      renderCursor();
    }

    requestAnimationFrame(pollGamepad);
  }

  // Initialization Hook
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      initOverlay();
      requestAnimationFrame(pollGamepad);
    });
  } else {
    initOverlay();
    requestAnimationFrame(pollGamepad);
  }

})();
</script>

</html>
