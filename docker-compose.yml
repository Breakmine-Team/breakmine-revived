# The whole breakmine site: the game client (nginx, :8000) and the auth/skin
# API (cors.js, :6006) in a single container, with user data on a volume.
#
# This replaces the old Nixpacks deploy. Differences worth knowing:
#   - tunnel.js (dev WebSocket tunnel on 6007) is no longer started.
#   - the client is served statically from index.html; no vite build.
#   - user data persists in the app_data volume. Nixpacks had no volume at all,
#     so every redeploy used to regenerate the JWT secret and orphan auth.db.
#
# Routing: no traefik labels on purpose -- both Dokploy and Coolify route by
# domain, so point each domain at the container port and let the panel own TLS:
#   breakmine.com   -> 8000  (game client, published on host 8080)
#   api.breakmine.com -> 6006 (cors.js API)

name: breakmine

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: breakmine:latest
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "6006"
    volumes:
      # Accounts (auth.db), the JWT secret and uploaded skins live here.
      - app_data:/data
    ports:
      - "8080:8000"
    expose:
      - "8000"
      - "6006"

volumes:
  app_data:
    name: breakmine-data
