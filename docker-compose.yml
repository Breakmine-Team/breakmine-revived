# The game client plus the auth/skin API.
#
#   web   :8000  the client, baked into the image (published on host 8080)
#   auth  :6006  cors.js, with user data on a volume
#         :6007  tunnel.js, the WebSocket game-traffic relay
#   server:6008  the multiplayer game server
#
# No traefik labels on purpose -- both Dokploy and Coolify route by domain, so
# point each domain at the container port and let the panel own TLS:
#   breakmine.com     -> 8000
#   api.breakmine.com -> 6006
#
name: breakmine

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: breakmine-web:latest
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - dokploy-network
    labels:
      - "traefik.docker.network=dokploy-network"

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    image: breakmine-auth:latest
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "6006"
      TUNNEL_PORT: "6007"
    volumes:
      # Accounts (auth.db), the JWT secret and uploaded skins. Losing this
      # volume signs everyone out and orphans every uploaded skin.
      - auth_data:/data
    expose:
      - "6006"
      - "6007"
    networks:
      - dokploy-network
    labels:
      - "traefik.docker.network=dokploy-network"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: breakmine-server:latest
    restart: unless-stopped
    # Saving a large world on SIGTERM can take a few seconds; Docker's 10s
    # default used to force-kill it, and Dokploy then saw a stuck old instance.
    stop_grace_period: 30s
    environment:
      DATA_DIR: /data
      SERVER_PORT: "6008"
      # Optional griefing switches: set to "true" to disable.
      # SERVER_DISABLE_TNT: "true"
      # SERVER_DISABLE_LIQUID_FLOW: "true"
      # Extra super operators, comma separated. Always super ops; not saved
      # to serverconfig.conf and not removable with /unsop.
      # SUPER_OPS: "alice, bob"
      # Connection protection. Both are on by default; set the matching
      # variable to "false" to turn one off.
      # SERVER_ANTIDDOS: "true"
      # SERVER_ANTIVPN: "true"
      # SERVER_ANTIVPN_PROVIDER: "proxycheck"
      # SERVER_ANTIVPN_KEY: "your-key"
      # SERVER_ANTIVPN_FAIL_OPEN: "true"
      # Client address behind play.breakmine.com's proxy. Left unset, loopback
      # and LAN proxies are trusted automatically; list the proxy here if it
      # reaches this container from a public address.
      # SERVER_TRUST_PROXY: "203.0.113.10"
    volumes:
      # World data, player data, and server configuration. Losing this
      # volume deletes all worlds and player progress.
      - server_data:/data
    ports:
      - "6008:6008"

networks:
  # Dokploy's Traefik only routes to ports on this network; without it the
  # compose containers are reachable directly but every domain returns 502.
  dokploy-network:
    external: true

volumes:
  auth_data:
    name: breakmine-auth-data
  server_data:
    name: breakmine-server-data
