# Port to run on
port = 6008

# Not recommended to change this option
host = 0.0.0.0

# Multiserver support
# -------------------
# A "server" is a self-contained directory holding its own world_data.bin and
# its own serverconfig.conf.
#
#   main           -> ./world_data.bin and ./serverconfig.conf (this file)
#   <name>         -> ./worlds/<name>/world_data.bin and ./worlds/<name>/serverconfig.conf
#
# Start a specific server at launch with:  node server.js --server <name>
# Switch servers in-game with the /server command.
#
# server = "main" picks the server used when no --server flag is given.
server = "main"

# Optional explicit list of servers. When empty (default) the available
# servers are auto-detected from directories under ./worlds/.
# servers = ["server2", "server3"]

# Default gamemode
# 0 = survival
# 1 = creative
# 3 = spectator
default_gamemode = creative

# OP by default
default_op = true

# If default_op = false then this works
# List of OP players
op_player_list = []

# MOTD
motd = "Brand new server"

# Allow modded clients to join
allowMods = false

# Worldtype
# flat      = classic flat layer (seed is ignored)
# normal    = rolling terrain with caves and ores
# amplified = normal terrain with taller, steeper mountains
worldType = "flat"

# World seed. Any number, signed long (e.g. -5529091579467429620) or a
# word (hashed, e.g. "cool"). Leave empty ("") for a random seed.
seed = 123