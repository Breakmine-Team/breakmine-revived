# The game client plus the auth/skin API.
#
#   web   :8000  the client, served from the checkout (published on host 8080)
#   auth  :6006  cors.js, with user data on a volume
#
# No traefik labels on purpose -- both Dokploy and Coolify route by domain, so
# point each domain at the container port and let the panel own TLS:
#   breakmine.com     -> 8000
#   api.breakmine.com -> 6006
#
# One caveat on `web`: it serves the whole checkout, so /data (auth.db and
# secrets.json) is reachable over HTTP on port 8080. Serve only the client
# directory if that port is ever exposed publicly.

name: breakmine

services:
  web:
    image: python:3.11-alpine
    ports:
      - "8080:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: python3 -m http.server 8000

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    image: breakmine-auth:latest
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "6006"
    volumes:
      # Accounts (auth.db), the JWT secret and uploaded skins. Losing this
      # volume signs everyone out and orphans every uploaded skin.
      - auth_data:/data
    expose:
      - "6006"

volumes:
  auth_data:
    name: breakmine-auth-data
