providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"
DATA_DIR = "/data"
SERVER_PORT = "6008"

[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake"]

[phases.build]
# Generated client assets, then the static site directory that gets served.
# There is no Vite step: vite is a devDependency, and the client is native ES
# modules that run straight from src/ (same tree the Docker image serves).
cmds = ["node scripts/build-assets.js", "node scripts/build-site.js"]

[start]
cmd = "npx concurrently \"PORT=6006 node cors.js\" \"TUNNEL_PORT=6007 node tunnel.js\" \"npx serve -s public -l tcp://0.0.0.0:8000\" \"SERVER_PORT=6008 node server.js\" \"node backup-server.js\""

[mounts]
data = "/data"
