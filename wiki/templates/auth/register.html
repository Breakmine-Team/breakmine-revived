{% set base_template = 'layouts/mods_base.html' if config.get('IS_MODS_APP') else 'layouts/wiki_base.html' %}
{% extends base_template %}

{% block content %}
  {% if error %}
    <p class="error-msg">{{ error }}</p>
  {% endif %}

  <form action="{{ url_for('auth.register') }}" method="post">
    <div class="input-field">
      <input type="text" id="username" name="username" required minlength="2" maxlength="32">
      <label for="username">Username (2-32 characters, alphanumeric/underscores)</label>
    </div>
    <div class="input-field">
      <input type="password" id="password" name="password" required minlength="4">
      <label for="password">Password (Minimum 4 characters)</label>
    </div>
    <div class="input-field">
      <input type="password" id="confirm" name="confirm" required>
      <label for="confirm">Confirm Password</label>
    </div>
    <button type="submit" class="btn waves-effect waves-light teal">Register</button>
    <a href="/" class="btn-flat">Cancel</a>
  </form>
{% endblock %}
