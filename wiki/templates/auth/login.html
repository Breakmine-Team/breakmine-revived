{% set base_template = 'layouts/mods_base.html' if config.get('IS_MODS_APP') else 'layouts/wiki_base.html' %}
{% extends base_template %}

{% block content %}
  {% if error %}
    <p class="error-msg">{{ error }}</p>
  {% endif %}

  <form action="{{ url_for('auth.login') }}" method="post">
    <div class="input-field">
      <input type="text" id="username" name="username" required>
      <label for="username">Username</label>
    </div>
    <div class="input-field">
      <input type="password" id="password" name="password" required>
      <label for="password">Password</label>
    </div>
    <button type="submit" class="btn waves-effect waves-light teal">Login</button>
    <a href="{{ url_for('auth.register') }}" class="btn-flat">Register</a>
  </form>

  {% if discord_enabled %}
    <div style="margin-top: 20px;">
      <a href="{{ url_for('auth.discord_login') }}" class="btn waves-effect" style="background:#5865F2">Login with Discord</a>
    </div>
  {% endif %}
{% endblock %}
