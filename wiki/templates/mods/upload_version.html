{% extends "layouts/mods_base.html" %}

{% block content %}
  {% if error %}
    <p class="error-msg">{{ error }}</p>
  {% endif %}

  <form action="{{ url_for('mods.upload_version', mod_id=mod_id) }}" method="post" enctype="multipart/form-data">
    <div class="input-field">
      <input type="text" id="version" name="version" value="{{ next_ver }}" required>
      <label for="version" class="active">Version Name</label>
    </div>
    <div class="file-field input-field">
      <div class="btn teal">
        <span>File (.zip)</span>
        <input type="file" id="file" name="file" accept=".zip" required>
      </div>
      <div class="file-path-wrapper">
        <input class="file-path validate" type="text" placeholder="Upload zip file (Max 50 MB)">
      </div>
    </div>
    <button type="submit" class="btn-floating btn-large waves-effect waves-light teal"><i class="material-icons large">file_upload</i></button>
    <a href="{{ url_for('mods.view', mod_id=mod_id) }}" class="btn-floating btn-large waves-effect waves-dark grey" style="margin-left: 10px;"><i class="material-icons">close</i></a>
  </form>
{% endblock %}
