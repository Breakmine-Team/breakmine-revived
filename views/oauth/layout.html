<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex">
    <title>{{title}} · Breakmine</title>
    <link rel="icon" type="image/png" href="https://breakmine.com/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        /* Colours copied from the winlibJS window styles in index.html; the page
           itself fills the viewport, so no window border, shadow or radius. */
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; min-height: 100vh;
            background: #ffffff; color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px; line-height: 1.5;
        }
        .material-icons {
            font-family: 'Material Icons'; font-weight: normal; font-style: normal;
            font-size: 18px; line-height: 1; letter-spacing: normal; text-transform: none;
            display: inline-block; white-space: nowrap; direction: ltr;
            -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
        }
        .win-container {
            display: flex; flex-direction: column;
            width: 100%; min-height: 100vh;
            background: #ffffff; color: #333;
            transition: opacity 0.2s ease;
        }
        .win-container.busy { opacity: 0.65; pointer-events: none; }
        .top-progress { position: relative; height: 4px; overflow: hidden; background: #e4e4e4; border-bottom: 1px solid #d5d5d5; }
        .top-progress span { position: absolute; top: 0; bottom: 0; left: -40%; width: 40%; background: linear-gradient(to bottom, #8a8a8a 0%, #5f5f5f 100%); animation: oauth-slide 1.1s ease-in-out infinite; }
        .top-progress.hidden { display: none; }
        @keyframes oauth-slide { from { left: -40%; } to { left: 100%; } }
        .win-body {
            flex: 1; display: flex; flex-direction: column;
            width: 100%; max-width: 440px; margin: 0 auto;
            padding: 22px 18px 20px;
        }
        /* The submit form grows to fill the page, so its buttons sit on the
           bottom edge of the window. */
        .win-body > form:last-of-type { flex: 1; display: flex; flex-direction: column; }
        .win-body > form:last-of-type > .filled,
        .win-body > form:last-of-type > .actions { margin-top: auto; }
        .provider {
            display: flex; align-items: center; gap: 8px;
            margin: 0 0 16px; padding: 0 0 10px;
            border-bottom: 1px solid #dcdcdc;
            font-size: 12px; font-weight: 600; color: #6a6a6a;
            text-shadow: 0 1px 0 #fff;
        }
        .provider img { width: 20px; height: 20px; border-radius: 3px; object-fit: contain; }
        .brand-mark { display: none; width: 20px; height: 20px; border-radius: 3px; align-items: center; justify-content: center; background: linear-gradient(to bottom, #e2e2e2 0%, #bebebe 100%); border: 1px solid #b5b5b5; color: #4a4a4a; font-size: 11px; font-weight: 600; }
        .app-icon {
            width: 40px; height: 40px; margin: 0 0 14px; border-radius: 3px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            border: 1px solid #b5b5b5;
            color: #fff; font-size: 18px; font-weight: 600;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        img.app-icon { display: block; object-fit: contain; background: #f2f2f2; }
        h1, h2 {
            margin: 0 0 14px; font-size: 18px; font-weight: 600; line-height: 1.3;
            color: #333; text-shadow: 0 1px 0 #fff;
        }
        h2 strong { font-weight: 700; }
        .sub { margin: 0 0 14px; font-size: 13px; color: #5a5a5a; }
        .sub strong { color: #333; font-weight: 600; }
        .field { display: flex; flex-direction: column-reverse; margin: 0 0 12px; }
        /* Same styling as #tinyConsoleInput in index.html, only taller. */
        .field input {
            width: 100%; height: 42px; padding: 10px;
            user-select: text;
            background: linear-gradient(to bottom, #e6e6e6 0%, #f8f8f8 100%);
            border: 1px solid #b5b5b5; border-radius: 4px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.18);
            color: #222; font: inherit; font-size: 13px; outline: none;
        }
        .field span { display: block; margin: 0 0 4px; font-size: 12px; font-weight: 600; color: #4a4a4a; text-shadow: 0 1px 0 #fff; }
        button {
            font: inherit; cursor: pointer;
            background: linear-gradient(to bottom, #ececec 0%, #d8d8d8 100%);
            border: 1px solid #b5b5b5; border-radius: 3px; padding: 6px 15px;
            font-weight: 600; color: #4a4a4a;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
        }
        button:hover { background: linear-gradient(to bottom, #d8d8d8 0%, #c4c4c4 100%); }
        button:active { background: linear-gradient(to bottom, #c4c4c4 0%, #d8d8d8 100%); }
        .filled {
            width: 100%; padding: 7px 15px;
            border-color: #2f6cb4; color: #fff;
            background: linear-gradient(to bottom, #6aa8ec 0%, #3f7fd0 100%);
            text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.25);
        }
        .filled:hover { border-color: #285e9e; background: linear-gradient(to bottom, #5b9be6 0%, #356fbd 100%); }
        .filled:active { background: linear-gradient(to bottom, #3f7fd0 0%, #6aa8ec 100%); }
        .filled.auto { width: auto; }
        .outlined { background: transparent; border-color: #b5b5b5; color: #4a4a4a; }
        .outlined:hover { background: linear-gradient(to bottom, #f0f0f0 0%, #dedede 100%); }
        .link { padding: 0; border: 0; background: none; color: #3a3a3a; font-size: 12px; text-decoration: underline; text-shadow: none; }
        .link:hover { color: #000; background: none; }
        .toggle { margin: 0 0 12px; text-align: center; font-size: 12px; color: #5a5a5a; }
        .account-chip {
            display: inline-flex; align-items: center; gap: 8px;
            margin: 0 0 16px; padding: 3px 12px 3px 3px;
            background: #ececec; border: 1px solid #b5b5b5; border-radius: 3px;
            font-size: 13px; font-weight: 600; color: #4a4a4a;
            text-shadow: 0 1px 0 #fff;
        }
        .avatar {
            width: 24px; height: 24px; border-radius: 3px; flex: 0 0 auto;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(to bottom, #e2e2e2 0%, #bebebe 100%);
            border: 1px solid #b5b5b5; color: #4a4a4a; font-size: 11px; font-weight: 600;
        }
        .scope-title { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: #4a4a4a; }
        .scopes { display: flex; flex-direction: column; gap: 10px; margin: 0 0 16px; }
        .scope { display: flex; align-items: flex-start; gap: 10px; font-size: 12px; line-height: 1.4; color: #5a5a5a; }
        .scope .material-icons { color: #6f6f6f; margin-top: 1px; }
        .disclaimer { margin: 0 0 16px; font-size: 11px; line-height: 1.4; color: #777; }
        .verified-badge { color: #2f7d46; font-size: 16px; margin-left: 4px; vertical-align: -3px; }
        .actions { display: flex; justify-content: flex-end; gap: 8px; }
        .notice { margin: 0 0 14px; padding: 8px 10px; border-radius: 3px; font-size: 12px; line-height: 1.45; text-shadow: none; }
        .notice.warn { background: #fff6d8; border: 1px solid #e2c274; color: #6b4f12; }
        .notice.error { background: #fbe0e0; border: 1px solid #d9a6a6; color: #8f1e1e; }
        .foot { margin: 0 0 14px; font-size: 11px; line-height: 1.45; color: #777; text-align: center; }
        .foot .link { font-size: 11px; }
        @media only screen and (max-width: 420px) {
            .win-body { padding: 16px 12px 16px; }
            h1, h2 { font-size: 16px; }
        }
    </style>
</head>
<body>
    <main class="win-container" id="auth-card">
        <div class="top-progress hidden" id="auth-progress"><span></span></div>
        <div class="win-body">
{{body}}
        </div>
    </main>
    <script>
        // Both buttons are plain form submits; this only paints the progress bar
        // the moment one of them is pressed.
        Array.prototype.forEach.call(document.querySelectorAll('form'), function (form) {
            form.addEventListener('submit', function () {
                document.getElementById('auth-progress').classList.remove('hidden');
                document.getElementById('auth-card').classList.add('busy');
            });
        });
    </script>
</body>
</html>
