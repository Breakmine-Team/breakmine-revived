        {{brandHeader}}
        <h2>{{heading}}</h2>
        <p class="sub"><strong>{{clientName}}</strong> ({{host}}) wants to use your Breakmine account.</p>
{{error}}
        <form method="post" action="/oauth/authorize" autocomplete="on">
            {{fields}}
            <label class="field">
                <input type="text" name="username" placeholder=" " required minlength="3" maxlength="32" autocomplete="username" value="{{username}}">
                <span>Username</span>
            </label>
            <label class="field">
                <input type="password" name="password" placeholder=" " required minlength="6" maxlength="128" autocomplete="{{passwordAutocomplete}}">
                <span>Password</span>
            </label>
            <p class="toggle"><a class="link" href="{{switchHref}}">{{switchLabel}}</a></p>
            <button type="submit" class="filled" name="action" value="{{action}}">{{submitLabel}}</button>
        </form>
