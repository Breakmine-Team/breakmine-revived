# Port to run on
port = 6008

# Not recommended to change this option
host = 0.0.0.0

# Multiserver support
# -------------------
# A "server" is a self-contained directory holding its own world_data.bin, its
# players and bans, and its own serverconfig.conf.
#
#   main           -> ./world_data.bin and ./serverconfig.conf (this file)
#   <name>         -> ./worlds/<name>/world_data.bin and ./worlds/<name>/serverconfig.conf
#
# Start a specific server at launch with:  node server.js --server <name>
# Switch servers in-game with the /server command.
#
# server = "main" picks the server used when no --server flag is given.
server = "main"

# Running several servers at once
# -------------------------------
# List two or more servers here and starting the server runs them side by side:
# one child process each, on its own port, with its own world and players. The
# list is opt-in, so directories under ./worlds/ that are not listed are never
# started - /server still offers them.
#
#   servers = ["main", "second"]
#
# "main" listens on the port in this file. Every other server needs its own port
# in its own serverconfig.conf, e.g. worlds/second/serverconfig.conf:
#
#   port = 6009
#
# Players cannot move between them with /server; each one is a separate address
# to connect to (play.example.com:6008 and :6009). Publish each port through
# Docker the same way the first one is published.
#
# When empty (default) only one server runs, and the servers offered by /server
# are auto-detected from directories under ./worlds/.
servers = []

# Default gamemode
# 0 = survival
# 1 = creative
# 3 = spectator
default_gamemode = creative

# OP by default
default_op = true

# If default_op = false then this works
# List of OP players
op_player_list = []

super_op_player_list = []

# MOTD
motd = "Brand new server"

# Allow modded clients to join
allowMods = false

# Server-side mods
# ----------------
# Mods in `servermods/` (relative to this server's directory) are loaded by
# the server and sent to every player when they join. Clients register them
# for that connection only and remove them again when they leave.
# Set to false to neither load nor send them.
serverMods = true

# Folder name, relative to this server's directory. The main server uses
# ./servermods; worlds/<name>/ uses worlds/<name>/servermods.
serverModsDir = "servermods"

# Worldtype
# flat      = classic flat layer (seed is ignored)
# normal    = rolling terrain with caves and ores
# amplified = normal terrain with taller, steeper mountains
worldType = "flat"

# Client-side world generation
# ----------------------------
# Flat and normal worlds are reproducible from their type and seed, so joining
# clients build that terrain themselves, in a worker thread, instead of
# receiving every chunk. The server still sends chunks that hold block changes
# and still generates the columns it needs for physics, spawn checks and edits.
#   true  = clients generate flat/normal terrain themselves (default)
#   false = stream every chunk from the server
clientWorldGen = true

# Icon
icon = "server_icon.png"

# World seed. Any number, signed long (e.g. -5529091579467429620) or a
# word (hashed, e.g. "cool"). Leave empty ("") for a random seed.
seed = 123